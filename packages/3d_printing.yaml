binary_sensor:
  - platform: group
    unique_id: 5925131a-032c-47f0-bae7-1b71c82a8293
    name: Impression 3D terminée récemment
    all: false
    entities:
      - binary_sensor.bambi_fin_recente
      - binary_sensor.panpan_fin_recente

template:
  - binary_sensor:
      - unique_id: 26c064ac-e5e7-4cb3-8878-c86b39638e10
        name: Impression 3D en cours
        icon: mdi:printer-3d-nozzle
        state: >-
          {{ is_state('sensor.bambi_etat_de_l_impression', 'running')
             or is_state('sensor.panpan_etat_de_l_impression', 'running') }}

  - sensor:
      - unique_id: c09493c2-b0cc-4e9d-88a1-88f62013d056
        name: Impression 3D nocivité matériau
        icon: mdi:skull-crossbones
        state: >-
          {% set forte = ['ABS', 'ABS-GF', 'ASA', 'ASA-AERO', 'ASA-CF', 'PC', 'PA-CF', 'PA6-CF', 'PPA-CF', 'PPA-GF', 'PPS', 'PPS-CF'] %}
          {% set moderee = ['PA', 'PA-GF', 'PETG', 'PETG-CF', 'PET-CF', 'PCTG', 'TPU', 'TPU-AMS', 'HIPS', 'PE-CF', 'PP-CF', 'PP-GF'] %}
          {% set ns = namespace(materials=[]) %}
          {% if is_state('sensor.bambi_etat_de_l_impression', 'running') %}
            {% set ns.materials = ns.materials + [state_attr('sensor.bambi_emplacement_actif', 'type') | default('')] %}
          {% endif %}
          {% if is_state('sensor.panpan_etat_de_l_impression', 'running') %}
            {% set ns.materials = ns.materials + [state_attr('sensor.panpan_emplacement_actif', 'type') | default('')] %}
          {% endif %}
          {% if ns.materials | select('in', forte) | list | count > 0 %}
            Forte
          {% elif ns.materials | select('in', moderee) | list | count > 0 %}
            Modérée
          {% elif ns.materials | length > 0 %}
            Faible
          {% else %}
            Aucune
          {% endif %}

mqtt:
  sensor:
    - unique_id: fc87cbe1-8612-4777-8cbe-588c5b41ff88
      name: Température
      device_class: temperature
      unit_of_measurement: °C
      state_class: measurement
      suggested_display_precision: 1
      state_topic: bsb-lan/0/35/8740
      device:
        identifiers: "atlantic_heat_pump_thermostat_first_floor"
        name: Thermostat Premier étage
        configuration_url: "http://bsb-lan.local/"
        manufacturer: "Atlantic"
        model: Alfea Extensa Duo AI
  climate:
    - unique_id: 6663d002-65e5-4b82-9c92-f2be53d0043e
      name: Thermostat
      modes:
        - auto
        - heat
        - "off"
      min_temp: 10
      max_temp: 35
      temp_step: 0.5
      temperature_unit: C
      mode_state_topic: bsb-lan/0/11/700
      mode_state_template: >-
        {% set v = value.split(' - ')[0] %}
        {% set modes = { '0':'off', '1':'auto', '2':'heat', '3':'heat'} %}
        {{ modes[v] if v in modes.keys() else 'off' }}
      current_temperature_topic: bsb-lan/0/35/8740
      temperature_state_topic: bsb-lan/0/35/8741
      action_topic: bsb-lan/0/32/8000
      action_template: >-
        {% set v = value.split(' - ')[0] %}
        {% set defrosting = ['23'] %}
        {% set preheating= ['112'] %}
        {% set heating = ['114', '116'] %}
        {% if v in defrosting %}
        defrosting
        {% elif v in preheating %}
        preheating
        {% elif v in heating %}
        heating
        {% else %}
        idle
        {% endif %}
      device:
        identifiers: "atlantic_heat_pump_thermostat_first_floor"
  binary_sensor:
    - unique_id: 7195a678-ac15-4515-9c24-0566e8d81bd8
      name: État pompe à chaleur
      entity_category: diagnostic
      state_topic: bsb-lan/0/35/8730
      value_template: "{{ 'ON' if value.split(' - ')[0] == '1' else 'OFF' }}"
      device:
        identifiers: "atlantic_heat_pump_thermostat_first_floor"

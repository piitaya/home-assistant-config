rest_command:
  spoolman_get_spools:
    url: "http://10.0.1.10:7912/api/v1/spool"
    method: GET

  spoolman_find_filament:
    url: "http://10.0.1.10:7912/api/v1/filament?vendor_id=1&material={{ material }}&color_hex={{ color_hex }}"
    method: GET

  spoolman_create_filament:
    url: "http://10.0.1.10:7912/api/v1/filament"
    method: POST
    content_type: "application/json"
    payload: >-
      {
        "name": "{{ name }}",
        "vendor_id": 1,
        "material": "{{ material }}",
        "density": {{ density }},
        "diameter": {{ diameter }},
        "weight": {{ weight }},
        "spool_weight": 250,
        "settings_extruder_temp": {{ (min_temp | int + max_temp | int) // 2 }},
        "settings_bed_temp": {{ bed_temp }},
        "color_hex": "{{ color_hex }}",
        "external_id": "{{ external_id }}"
      }

  spoolman_create_spool:
    url: "http://10.0.1.10:7912/api/v1/spool"
    method: POST
    content_type: "application/json"
    payload: >-
      {
        "filament_id": {{ filament_id }},
        "initial_weight": {{ initial_weight }},
        "extra": {"tag": "\"{{ tray_uid }}\""}
      }

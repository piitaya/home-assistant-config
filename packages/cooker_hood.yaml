template:
  - fan:
      - unique_id: 403f2b47-a1fd-4c46-828c-66cb073bbfb9
        speed_count: 4
        set_percentage:
          - variables:
              repeats: "{{ (percentage - this.attributes.get('percentage', 0)) / 25 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ repeats > 0 }}"
                sequence:
                  - action: remote.send_command
                    data:
                      device: hood
                      command: plus
                      delay_secs: 0.1
                      num_repeats: "{{ repeats }}"
                    target:
                      entity_id:
                        - remote.rm4_pro
              - conditions:
                  - condition: template
                    value_template: "{{ repeats < 0 }}"
                sequence:
                  - action: remote.send_command
                    data:
                      device: hood
                      command: minus
                      delay_secs: 0.1
                      num_repeats: "{{ -repeats }}"
                    target:
                      entity_id:
                        - remote.rm4_pro
        turn_on:
          - action: remote.send_command
            data:
              device: hood
              command: plus
            target:
              entity_id:
                - remote.rm4_pro
        turn_off:
          - action: remote.send_command
            data:
              device: hood
              command: minus
              delay_secs: 0.1
              num_repeats: 4
            target:
              entity_id:
                - remote.rm4_pro
        default_entity_id: fan.cooker_hood
        name: Hotte
        percentage: "{{ states('sensor.cooker_hood_fan_level') | int * 25 }}"
        state: "{{ states('sensor.cooker_hood_fan_level') | int > 0 }}"

  - light:
      - unique_id: 285641c8-d01b-4de2-8ce7-487684ad1238
        turn_on:
          - condition: state
            entity_id:
              - binary_sensor.cooker_hood_light_state
            state: "off"
            match: all
          - action: remote.send_command
            data:
              device: hood
              command: light
            target:
              entity_id:
                - remote.rm4_pro
        turn_off:
          - condition: state
            entity_id:
              - binary_sensor.cooker_hood_light_state
            state: "on"
            match: all
          - action: remote.send_command
            data:
              device: hood
              command: light
            target:
              entity_id:
                - remote.rm4_pro
        default_entity_id: light.cooker_hood_light
        name: Lumière de la hotte
        state: "{{ states('binary_sensor.cooker_hood_light_state') }}"

  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.cooker_hood_power
        to:
        for:
          seconds: 2.5
      - trigger: numeric_state
        entity_id: sensor.cooker_hood_power
        below: 4
    binary_sensor:
      - unique_id: 2499d9d0-b1ca-476e-95f2-3a6694e2f4ea
        name: "Hotte état lumière"
        state: >
          {% set value = states("sensor.cooker_hood_power") | float %}
          {% set light = "off" %}
          {% if value > 110 %}
          {% set light = "on" %}
          {% elif value > 100 %}
          {% set light = "off" %}
          {% elif value > 75 %}
          {% set light = "on" %}
          {% elif value > 66 %}
          {% set light = "off" %}
          {% elif value > 40 %}
          {% set light = "on" %}
          {% elif value > 27 %}
          {% set light = "off" %}
          {% elif value > 17 %}
          {% set light = "on" %}
          {% elif value > 10 %}
          {% set light = "on" %}
          {% elif value > 5 %}
          {% set light = "off" %}
          {% endif %}
          {{ light }}
    sensor:
      - unique_id: 27efd0b8-cfbd-4af7-8d51-d72ae9efd971
        name: "Hotte niveau ventilation"
        state: >
          {% set value = states("sensor.cooker_hood_power") | float %}
          {% set fan = 0 %}
          {% if value > 110 %}
          {% set fan = 4 %}
          {% elif value > 100 %}
          {% set fan = 4 %}
          {% elif value > 75 %}
          {% set fan = 3 %}
          {% elif value > 66 %}
          {% set fan = 3 %}
          {% elif value > 40 %}
          {% set fan = 2 %}
          {% elif value > 27 %}
          {% set fan = 2 %}
          {% elif value > 17 %}
          {% set fan = 1 %}
          {% elif value > 10 %}
          {% set fan = 0 %}
          {% elif value > 5 %}
          {% set fan = 1 %}
          {% endif %}
          {{ fan }}

    input_boolean.vacuum_zone_toilets:
      vacuum_name: "alfred"
    input_boolean.vacuum_zone_living_room:
      vacuum_name: "alfred"
    input_boolean.vacuum_zone_hall:
      vacuum_name: "alfred"
    input_boolean.vacuum_zone_guest_room:
      vacuum_name: "alfred"
    input_boolean.vacuum_zone_kitchen:
      vacuum_name: "alfred"
    input_boolean.vacuum_zone_ariane_bedroom:

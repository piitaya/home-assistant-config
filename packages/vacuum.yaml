template:
  - sensor:
      - unique_id: b7e4f1a2-3c9d-4e8f-a5b6-c7d8e9f0a1b2
        name: "Pièces sélectionnées (Alfred)"
        icon: mdi:home-floor-0
        unit_of_measurement: "Pièces"
        state: |
          {{
            expand(states.input_boolean)
              | selectattr('attributes.vacuum_name', 'defined')
              | selectattr('attributes.vacuum_name', 'eq', 'alfred')
              | selectattr('state', 'eq', 'on')
              | list
              | map(attribute='entity_id')
              | list
              | map('area_id')
              | select('ne', None)
              | list
              | count
          }}
        attributes:
          area_ids: |
            {{
              expand(states.input_boolean)
                | selectattr('attributes.vacuum_name', 'defined')
                | selectattr('attributes.vacuum_name', 'eq', 'alfred')
                | selectattr('state', 'eq', 'on')
                | list
                | map(attribute='entity_id')
                | list
                | map('area_id')
                | select('ne', None)
                | list
                | sort
            }}
      - unique_id: c8f5a2b3-4d0e-5f9a-b6c7-d8e9f0a1b2c3
        name: "Pièces sélectionnées (Edgar)"
        icon: mdi:home-floor-1
        unit_of_measurement: "Pièces"
        state: |
          {{
            expand(states.input_boolean)
              | selectattr('attributes.vacuum_name', 'defined')
              | selectattr('attributes.vacuum_name', 'eq', 'edgar')
              | selectattr('state', 'eq', 'on')
              | list
              | map(attribute='entity_id')
              | list
              | map('area_id')
              | select('ne', None)
              | list
              | count
          }}
        attributes:
          area_ids: |
            {{
              expand(states.input_boolean)
                | selectattr('attributes.vacuum_name', 'defined')
                | selectattr('attributes.vacuum_name', 'eq', 'edgar')
                | selectattr('state', 'eq', 'on')
                | list
                | map(attribute='entity_id')
                | list
                | map('area_id')
                | select('ne', None)
                | list
                | sort
            }}

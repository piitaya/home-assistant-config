blueprint:
  name: Protection du soleil
  author: Piitaya
  description: Règle le volet en fonction de la position du soleil.
  source_url: https://gist.github.com/piitaya/3ef9de56183dcdcfd4fb38c51c8a4f04
  domain: automation
  input:
    shutter:
      name: Volet
      description: Volet à contrôler
      selector:
        entity:
          filter:
            - domain:
                - cover
          multiple: false
    facade:
      name: Façade
      description: Façade du volet
      selector:
        entity:
          include_entities:
            - binary_sensor.front_facade_exposed
            - binary_sensor.garden_facade_exposed
            - binary_sensor.cemetary_facade_exposed
          multiple: false
    opening_sensor:
      name: Capteur d'ouverture
      description: Le volet utilisera la position non-exposée si la fenêtre est ouverte.
      default: ""
      selector:
        entity:
          filter:
            - domain:
                - binary_sensor
              device_class:
                - opening
                - window
                - door
                - garage_door
          multiple: false
    additional_protection:
      name: Protection additionnelle
      description:
        Protection additionnelle pour le volet. Il peut s'agir d'une pergola
        devant le volet par exemple. Si cette protection est fermée, le volet sera
        considéré comme non-exposé.
      default: ""
      selector:
        entity:
          filter:
            - domain:
                - cover
          multiple: false
    position_exposed:
      name: Ouverture du volet au soleil
      description:
        L'ouverture du volet sera réglée à cette valeur si le volet est
        exposé au soleil.
      default: 15
      selector:
        number:
          min: 5.0
          max: 100.0
          mode: slider
          step: 5.0
          unit_of_measurement: "%"
    position_unexposed:
      name: Ouverture du volet à l'ombre
      description:
        L'ouverture du volet sera réglée à cette valeur si le volet n'est
        pas exposé au soleil.
      default: 100
      selector:
        number:
          min: 5.0
          max: 100.0
          mode: slider
          step: 5.0
          unit_of_measurement: "%"
    custom_conditions:
      name: Conditions personnalisées
      description:
        L'ouverture ou la fermeture des volets ne sera exécutée que si
        les conditions sont vérifiées.
      default: []
      selector:
        condition: {}
mode: parallel
max: 100
trigger_variables:
  opening_sensor_entity: !input opening_sensor
  additional_protection_entity: !input additional_protection
variables:
  position_tolerance: 5
  position_exposed: !input position_exposed
  position_unexposed: !input position_unexposed
  shutter_entity: !input shutter
  opening_sensor_entity: !input opening_sensor
triggers:
  - trigger: state
    alias: Quand la façade devient exposée au soleil
    entity_id: !input facade
    from: "off"
    to: "on"
  - trigger: state
    alias: Quand la façade n'est plus exposée au soleil
    entity_id: !input facade
    from: "on"
    to: "off"
  - trigger: template
    alias: Quand la fenêtre (capteur d'ouverture) s'ouvre
    value_template: "{{ is_state(opening_sensor_entity, 'on') }}"
  - trigger: template
    alias: Quand la fenêtre (capteur d'ouverture) se ferme
    value_template: "{{ is_state(opening_sensor_entity, 'off') }}"
  - trigger: template
    alias: Quand la protection additionnelle s'ouvre
    value_template: "{{ is_state(additional_protection_entity, 'open') }}"
  - trigger: template
    alias: Quand la protection additionnelle se ferme
    value_template: "{{ is_state(additional_protection_entity, 'closed') }}"
  - trigger: state
    alias: Réévaluation manuelle via le bouton
    entity_id: input_button.set_shutters_sun_position
    to:
  - trigger: event
    alias: Quand une commande d'ouverture est appelée (individuel ou groupe)
    event_type: call_service
    event_data:
      domain: cover
      service: open_cover
    id: open_cover
  - trigger: event
    alias: Quand une ouverture totale (position 100%) est appelée
    event_type: call_service
    event_data:
      domain: cover
      service: set_cover_position
      service_data:
        position: 100
    id: open_cover
conditions:
  - condition: and
    alias: Si les conditions personnalisées sont vérifiées
    conditions: !input custom_conditions
  - condition: or
    conditions:
      - condition: and
        alias: Réévaluation d'un volet déjà ouvert ou en mouvement
        conditions:
          - condition: not
            alias: Si ce n'est pas une ouverture depuis fermé
            conditions:
              - condition: trigger
                id: open_cover
          - condition: state
            alias: Si le volet est ouvert ou en mouvement
            entity_id: !input shutter
            state:
              - "open"
              - "opening"
              - "closing"
      - condition: and
        alias: Ouverture d'un volet fermé
        conditions:
          - condition: trigger
            alias: Si c'est une commande d'ouverture
            id: open_cover
          - condition: state
            alias: Si le volet est encore fermé (capté avant qu'il ne bouge)
            entity_id: !input shutter
            state: "closed"
          - condition: template
            alias: Si la commande vise bien ce volet (groupe résolu via expand) et n'est pas la nôtre
            value_template: >
              {% set eid = trigger.event.data.service_data.entity_id | default([]) %}
              {{
                trigger.event.context.id != this.context.id
                and shutter_entity in (expand(eid) | map(attribute='entity_id') | list)
              }}

actions:
  # Sur une ouverture, on laisse la commande d'ouverture s'exécuter d'abord :
  # sinon, pour un groupe, l'open relayé au volet écraserait la position solaire
  # qu'on applique juste après.
  - alias: Laisser passer la commande d'ouverture avant de corriger la position
    if:
      - condition: trigger
        id: open_cover
    then:
      - delay:
          seconds: 2
  - alias: Régler le volet selon l'exposition au soleil
    if:
      - condition: not
        alias: Si la fenêtre n'est pas ouverte
        conditions:
          - condition: template
            value_template: "{{ is_state(opening_sensor_entity, 'on') }}"
      - condition: not
        alias: Si la protection additionnelle n'est pas fermée
        conditions:
          - condition: template
            value_template: "{{ is_state(additional_protection_entity, 'closed') }}"
      - condition: state
        alias: Si la façade est exposée au soleil
        entity_id: !input facade
        state: "on"
    then:
      - condition: template
        alias: Seulement si la position actuelle diffère de la cible exposée
        value_template:
          "{% set shutter_position = state_attr(shutter_entity, 'current_position')
          | int %} {{ (shutter_position - position_exposed) | abs > position_tolerance
          }}"
      - alias: Régler à la position exposée (protection soleil)
        service: cover.set_cover_position
        data:
          position: "{{ position_exposed }}"
        target:
          entity_id: !input shutter
    else:
      - condition: template
        alias: Seulement si la position actuelle diffère de la cible non-exposée
        value_template:
          "{% set shutter_position = state_attr(shutter_entity, 'current_position')
          | int %} {{ (shutter_position - position_unexposed) | abs > position_tolerance
          }}"
      - alias: Régler à la position non-exposée (ouvert)
        service: cover.set_cover_position
        data:
          position: "{{ position_unexposed }}"
        target:
          entity_id: !input shutter
    enabled: true

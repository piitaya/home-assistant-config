    - sensor.chambre_volet_puissance
    - sensor.chambre_d_amis_volet_puissance
    - sensor.cuisine_volet_puissance
    - sensor.salon_volet_cimetiere_puissance
    - sensor.salon_volet_gauche_puissance
    - sensor.salon_volet_droit_puissance
    - sensor.salon_volet_jardin_puissance
    - sensor.buanderie_volet_puissance
    - sensor.bureau_volet_puissance
    - sensor.toilettes_volet_puissance
    - sensor.salle_de_bain_du_haut_volet_puissance
    trigger: numeric_state
  conditions: []
  actions:
  - data:
      entity_id: "{% set device = device_id(trigger.entity_id) %} \n{% set entities
        = device_entities(device) %} \n{{ expand(entities) | selectattr(\"domain\",
        \"eq\", \"cover\") |\nmap(attribute=\"entity_id\") | first }}\n"
    alias: Mettre à jour la position du volet concerné
    action: zwave_js.refresh_value
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - data:
      entity_id: "{% set device = device_id(trigger.entity_id) %} \n{% set entities
        = device_entities(device) %} \n{{ expand(entities) | selectattr(\"domain\",
        \"eq\", \"cover\") |\nmap(attribute=\"entity_id\") | first }}\n"
    alias: Mettre à jour la position du volet concerné
    action: zwave_js.refresh_value
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - data:
      entity_id: "{% set device = device_id(trigger.entity_id) %} \n{% set entities
        = device_entities(device) %} \n{{ expand(entities) | selectattr(\"domain\",
        \"eq\", \"cover\") |\nmap(attribute=\"entity_id\") | first }}\n"
    alias: Mettre à jour la position du volet concerné
    action: zwave_js.refresh_value
  mode: parallel
  max: 15

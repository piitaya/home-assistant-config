      actions:
      - action: script.turn_on
        metadata: {}
        data:
          variables:
            user_message: "{% from 'format.jinja' import join_fr %}\n{% set entity_id
              = \"binary_sensor.first_floor_windows_opening\" %}\n{%\n  set areas
              = expand(state_attr(entity_id, \"entity_id\"))\n  | selectattr('state',
              'eq', 'on')\n  | map(attribute=\"entity_id\")\n  | map(\"area_name\")\n
              \ | map(\"lower\")\n  | unique\n  | sort\n  | list\n%}\n{% set formatted_areas
              = join_fr(areas) | replace(\"ariane\", \"Ariane\") %}\n{% if areas |
              length > 1 %}\nFenêtres ouvertes : {{ formatted_areas }}.\n{% else %}\nFenêtre
              ouverte : {{ formatted_areas }}.\n{% endif %}\n"
        target:
          entity_id: script.notifier_des_fenetres_ouvertes_a_l_etage
      duration:
        hours: 0
        minutes: 5
        seconds: 0
      reminder:
        hours: 0
        minutes: 5
        seconds: 0

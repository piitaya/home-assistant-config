- id: '1770227763603'
  alias: Mode nuit - Activation par présence au lit
  description: Active le mode nuit quand Paul et Marina sont au lit après 21 h.
  triggers:
  - alias: Quand quelqu'un se met au lit pendant 1 minute
    trigger: state
    entity_id:
    - binary_sensor.lit_paul_presence
    - binary_sensor.lit_marina_presence
    to:
    - 'on'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    from:
    - 'off'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.paul
      state: home
    - condition: state
      entity_id: person.marina
      state: home
    alias: Au moins une personne à la maison
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: person.paul
        state: home
    - condition: state
      entity_id: binary_sensor.lit_paul_presence
      state: 'on'
    alias: Paul absent ou Paul au lit
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: person.marina
        state: home
    - condition: state
      entity_id: binary_sensor.lit_marina_presence
      state: 'on'
    alias: Marina absente ou Marina au lit
  - condition: time
    after: '21:00:00'
    before: 05:00:00
    alias: Entre 21h00 et 05h00
  - condition: state
    entity_id: input_boolean.mode_nuit
    state: 'off'
    alias: Mode nuit est désactivé
  actions:
  - action: input_boolean.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.mode_nuit
    alias: Activer le mode nuit
  mode: single

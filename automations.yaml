  triggers:
  - entity_id:
    - binary_sensor.internet
    from: 'on'
    to: 'off'
    platform: state
  - entity_id:
    - binary_sensor.internet
    from: 'off'
    to: 'on'
    platform: state
  conditions: []
  actions:
  - if:
    - condition: state

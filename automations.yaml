          state: open
      sequence:
      - alias: Couper le purificateur (inutile porte ouverte)
        action: fan.turn_off
        target:
          entity_id: fan.purificateur_d_air
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.bambi_fin_recente
          state: 'on'
        - condition: state
          entity_id: binary_sensor.panpan_fin_recente
          state: 'on'
      sequence:
      - action: fan.set_preset_mode
        target:
          entity_id: fan.purificateur_d_air
        data:
          preset_mode: high
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.bambi_etat_de_l_impression
          state: running
        - condition: state
          entity_id: sensor.panpan_etat_de_l_impression
          state: running
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.purificateur_d_air
        data: {}
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.bambi_materiau_nocif
            state: 'on'
          - condition: state
            entity_id: binary_sensor.panpan_materiau_nocif
            state: 'on'
        then:
        - action: fan.set_preset_mode
          target:
            entity_id: fan.purificateur_d_air
          data:
            preset_mode: high
        else:
        - action: fan.set_preset_mode
          target:
            entity_id: fan.purificateur_d_air
          data:
            preset_mode: medium
    default:
    - action: fan.turn_off
      target:
        entity_id: fan.purificateur_d_air
  mode: restart
- id: '1775234866636'
  alias: Éclairage automatique - Salle de bain haut
  description: Gère les spots de la salle de bain du haut selon la présence et l'heure.
  triggers:
  - entity_id:
    - binary_sensor.capteur_de_presence_salle_de_bain_du_haut_occupation
    from:
    - 'off'
    to:
    - 'on'
    trigger: state
  - entity_id:
    - binary_sensor.capteur_de_presence_salle_de_bain_du_haut_occupation
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    trigger: state
  - entity_id:
    - binary_sensor.salle_de_bain_du_haut_seche_serviettes_boost
    from:
    - 'on'
    to:
    - 'off'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: binary_sensor.capteur_de_presence_salle_de_bain_du_haut_occupation
        state:
        - 'on'
      - condition: state
        entity_id: binary_sensor.salle_de_bain_du_haut_seche_serviettes_boost
        state:
        - 'on'
    then:
    - choose:
      - conditions:
        - condition: time
          after: 09:00:00
          before: '19:00:00'
        sequence:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: 100
          target:
            entity_id:
            - light.spot_lavabo_etage
            - light.spots_salle_de_bain_etage
      - conditions:
        - condition: time
          after: '19:00:00'
          before: '21:00:00'
        sequence:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: 100
          target:
            entity_id: light.spot_lavabo_etage
      default:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 44
        target:
          entity_id: light.spot_lavabo_etage
    else:
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - light.spot_lavabo_etage
        - light.spots_salle_de_bain_etage
  mode: single

- id: '1689940894428'
  alias: Simulation Présence
  description: ''
  triggers:
  - at: 08:04:00
    id: ouvrir volets
    trigger: time
  - at: '19:21:00'
    id: fermer volets etage
    trigger: time
  - at: '20:10:00'
    id: allumer lumiere cuisine
    trigger: time
  - at: '20:34:00'
    id: allumer lumiere salon
    trigger: time
  - at: '21:34:00'
    id: fermer volets
    trigger: time
  - at: '21:00:00'
    id: eteindre lumiere cuisine
    trigger: time
  - at: '23:05:00'
    id: eteindre lumiere salon
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - ouvrir volets
      sequence:
      - data: {}
        target:
          entity_id:
          - cover.ground_floor_shutters
          - cover.first_floor_shutters
        action: cover.open_cover
      - delay:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
      - metadata: {}
        data: {}
        target:
          entity_id: input_button.set_shutters_sun_position
        action: input_button.press
    - conditions:
      - condition: trigger
        id:
        - fermer volets
      sequence:
      - data: {}
        target:
          entity_id:
          - cover.first_floor_shutters
          - cover.ground_floor_shutters
        action: cover.close_cover
    - conditions:
      - condition: trigger

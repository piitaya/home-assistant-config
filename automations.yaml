- id: '1790879694674'
  alias: Écran e-ink météo
  description: Affiche la météo de la journée (ou du lendemain après 18h) sur l'écran
    e-ink OpenDisplay.
  triggers:
  - at:
    - 06:00:00
    - '12:00:00'
    - '18:00:00'
    trigger: time
  - trigger: event.received
    target:
      entity_id: event.e_ink_bouton_1
    options:
      event_type:
      - button_down
  - event: start
    trigger: homeassistant
  actions:
  - action: weather.get_forecasts
    data:
      type: daily
    response_variable: meteo_d
    target:
      entity_id: weather.nieppe
  - action: weather.get_forecasts
    data:
      type: hourly
    response_variable: meteo_h
    target:
      entity_id: weather.nieppe
  - action: opendisplay.drawcustom
    data:
      background: white
      dither: none
      dry-run: false
      payload: "{%- set w = 'weather.nieppe' -%}\n{%- set hourly = meteo_h[w].forecast
        -%}\n{%- set daily = meteo_d[w].forecast -%}\n{%- set n = now() -%}\n{%- set
        offset = 1 if n.hour >= 18 else 0 -%}\n{%- set jour = (n + timedelta(days=offset)).date()
        -%}\n{%- set debut_h = 7 if offset == 1 else [7, n.hour] | max -%}\n{%- set
        icons = {'clear-night':'weather-night','cloudy':'weather-cloudy','exceptional':'alert-circle-outline','fog':'weather-fog','hail':'weather-hail','lightning':'weather-lightning','lightning-rainy':'weather-lightning-rainy','partlycloudy':'weather-partly-cloudy','pouring':'weather-pouring','rainy':'weather-rainy','snowy':'weather-snowy','snowy-rainy':'weather-snowy-rainy','sunny':'weather-sunny','windy':'weather-windy','windy-variant':'weather-windy-variant'}
        -%}\n{%- set rang = {'sunny':0,'clear-night':0,'partlycloudy':1,'cloudy':2,'windy':2,'windy-variant':2,'fog':3,'rainy':4,'snowy-rainy':5,'snowy':5,'hail':6,'pouring':6,'lightning':7,'lightning-rainy':7,'exceptional':8}
        -%}\n{%- set jours = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'] -%}\n{%-
        set ns = namespace(temps=[], pluie=[], pic=0, cond='sunny') -%}\n{%- for f
        in hourly -%}\n  {%- set t = as_local(as_datetime(f.datetime)) -%}\n  {%-
        if t.date() == jour and debut_h <= t.hour <= 21 -%}\n    {%- set ns.temps
        = ns.temps + [f.temperature] -%}\n    {%- if rang.get(f.condition, 0) > rang.get(ns.cond,
        0) -%}{%- set ns.cond = f.condition -%}{%- endif -%}\n    {%- if (f.precipitation
        | default(0)) >= 0.2 -%}\n      {%- set ns.pluie = ns.pluie + [t.hour] -%}\n
        \     {%- set ns.pic = [ns.pic, f.precipitation] | max -%}\n    {%- endif
        -%}\n  {%- endif -%}\n{%- endfor -%}\n{%- set d = daily | selectattr('datetime',
        'search', jour | string) | first | default(none) -%}\n{%- set tmin = (ns.temps
        | min) if ns.temps else d.templow -%}\n{%- set tmax = (ns.temps | max) if
        ns.temps else d.temperature -%}\n{%- set tmin = tmin | round(0) | int -%}\n{%-
        set tmax = tmax | round(0) | int -%}\n{%- if ns.cond == 'sunny' and not ns.temps
        and d -%}{%- set ns.cond = d.condition -%}{%- endif -%}\n{%- if not ns.pluie
        -%}\n  {%- set pluie_txt, pluie_icon = 'Pas de pluie', 'water-off-outline'
        -%}\n{%- else -%}\n  {%- set mot = 'Quelques gouttes' if ns.pic < 1 else 'Pluie
        faible' if ns.pic < 3 else 'Pluie modérée' if ns.pic < 7 else 'Pluie forte'
        -%}\n  {%- set a, b = ns.pluie | min, ns.pluie | max -%}\n  {%- set quand
        = 'toute la journée' if b - a >= 10 else 'vers ' ~ a ~ 'h' if a == b else
        a ~ 'h-' ~ (b + 1) ~ 'h' -%}\n  {%- set pluie_txt, pluie_icon = mot ~ ' '
        ~ quand, 'water-outline' -%}\n{%- endif -%}\n{%- set ns2 = namespace(slots=[])
        -%}\n{%- for h in [8, 13, 18, 21, 23] -%}\n  {%- set cible = n.replace(hour=h,
        minute=0, second=0, microsecond=0) + timedelta(days=offset) -%}\n  {%- if
        cible > n and ns2.slots | count < 3 -%}\n    {%- set ns3 = namespace(best=none,
        diff=99) -%}\n    {%- for f in hourly -%}\n      {%- set ecart = ((as_datetime(f.datetime)
        - cible).total_seconds() / 3600) | abs -%}\n      {%- if ecart < ns3.diff
        -%}{%- set ns3.best, ns3.diff = f, ecart -%}{%- endif -%}\n    {%- endfor
        -%}\n    {%- if ns3.best is not none and ns3.diff <= 2 -%}\n      {%- set
        ns2.slots = ns2.slots + [{'h': h, 'f': ns3.best}] -%}\n    {%- endif -%}\n
        \ {%- endif -%}\n{%- endfor -%}\n{%- set t1 = tmin ~ '°' -%}\n{%- set larg
        = 33 * (t1 | length - 1) + 20 -%}\n{%- set xa = 94 + larg + 22 -%}\n{%- set
        p = [\n  {'type':'icon','value':icons.get(ns.cond,'weather-cloudy'),'x':46,'y':44,'size':68,'color':'black','anchor':'mm'},\n
        \ {'type':'text','value':t1,'x':94,'y':46,'size':60,'color':'black','anchor':'lm','font':'rbm.ttf'},\n
        \ {'type':'line','x_start':xa - 12,'y_start':50,'x_end':xa + 11,'y_end':50,'fill':'black','width':4},\n
        \ {'type':'line','x_start':xa + 1,'y_start':40,'x_end':xa + 12,'y_end':51,'fill':'black','width':4},\n
        \ {'type':'line','x_start':xa + 1,'y_start':60,'x_end':xa + 12,'y_end':49,'fill':'black','width':4},\n
        \ {'type':'text','value':tmax ~ '°','x':xa + 26,'y':46,'size':60,'color':'black','anchor':'lm','font':'rbm.ttf'},\n
        \ {'type':'text','value':jours[jour.weekday()] ~ ' ' ~ jour.day,'x':374,'y':6,'size':20,'color':'black','anchor':'rt','font':'rbm.ttf'},\n
        \ {'type':'icon','value':pluie_icon,'x':46,'y':96,'size':30,'color':'black','anchor':'mm'},\n
        \ {'type':'text','value':pluie_txt,'x':94,'y':96,'size':24,'color':'black','anchor':'lm','font':'rbm.ttf'},\n
        \ {'type':'line','x_start':10,'y_start':114,'x_end':374,'y_end':114,'fill':'black','width':2}\n]
        -%}\n{%- set ns4 = namespace(p=p) -%}\n{%- for s in ns2.slots -%}\n  {%- set
        c = 70 + 121 * loop.index0 -%}\n  {%- set ns4.p = ns4.p + [\n    {'type':'icon','value':icons.get(s.f.condition,'weather-cloudy'),'x':c
        - 27,'y':142,'size':36,'color':'black','anchor':'mm'},\n    {'type':'text','value':s.h
        ~ 'h','x':c,'y':128,'size':20,'color':'black','anchor':'lm','font':'rbm.ttf'},\n
        \   {'type':'text','value':(s.f.temperature | round(0) | int) ~ '°','x':c,'y':154,'size':26,'color':'black','anchor':'lm','font':'rbm.ttf'}\n
        \ ] -%}\n{%- endfor -%}\n{{ ns4.p }}\n"
      refresh_type: full
      rotate: 270
    target:
      device_id: 0735cbab9399602f1ef0c4c57508f686
  mode: single

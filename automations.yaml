        after: 09:00:00
        before: '19:00:00'
      then:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 100
        target:
          entity_id: light.spots_salle_de_bain_etage
    else:
    - action: light.turn_off
      metadata: {}
      data: {}
      target:
        entity_id:
        - light.spot_lavabo_etage
        - light.spots_salle_de_bain_etage
  mode: single

      state: 'on'
    then:
    - action: notify.mobile_app_iphone_de_paul
      metadata: {}
      data:
        message: "Internet est revenu \U0001F642"
        title: Internet
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - action: rest_command.portainer_restart_container
      data:
        container: gluetun
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - action: rest_command.portainer_restart_container
      data:
        container: qbittorrent
    else:
    - action: notify.mobile_app_iphone_de_paul

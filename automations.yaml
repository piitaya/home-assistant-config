- id: '1774787085935'
  alias: Imprimante 3D - Purificateur d'air
  description: Pendant l'impression, règle le purificateur selon le filament puis
    le purge en fin de cycle.
  triggers:
  - trigger: state
    entity_id:
    - sensor.bambi_etat_de_l_impression
    - sensor.panpan_etat_de_l_impression
    - binary_sensor.bambi_fin_recente
    - binary_sensor.panpan_fin_recente
    - binary_sensor.bambi_materiau_nocif
    - binary_sensor.panpan_materiau_nocif
    - binary_sensor.capteur_porte_arriere
    - cover.garage_door
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - alias: Si la porte arrière du garage est ouverte
          condition: state
          entity_id: binary_sensor.capteur_porte_arriere
          state: 'on'
        - alias: Si la porte de garage est ouverte
          condition: state
          entity_id: cover.garage_door
          state: open
      sequence:
      - alias: Couper le purificateur (inutile porte ouverte)
        action: fan.turn_off
        target:
          entity_id: fan.purificateur_d_air
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.bambi_fin_recente
          state: 'on'
        - condition: state
          entity_id: binary_sensor.panpan_fin_recente
          state: 'on'
      sequence:
      - action: fan.set_preset_mode
        target:
          entity_id: fan.purificateur_d_air
        data:
          preset_mode: high
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.bambi_etat_de_l_impression
          state: running
        - condition: state
          entity_id: sensor.panpan_etat_de_l_impression
          state: running
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.purificateur_d_air
        data: {}
      - if:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.bambi_materiau_nocif
            state: 'on'
          - condition: state
            entity_id: binary_sensor.panpan_materiau_nocif
            state: 'on'
        then:
        - action: fan.set_preset_mode
          target:
            entity_id: fan.purificateur_d_air
          data:
            preset_mode: high
        else:
        - action: fan.set_preset_mode
          target:
            entity_id: fan.purificateur_d_air
          data:
            preset_mode: medium
    default:
    - action: fan.turn_off
      target:
        entity_id: fan.purificateur_d_air
  mode: restart

- id: '1706445548005'
  alias: Projecteur extérieur - Lumière automatique
  description: Allumer ou éteindre le projecteur extérieur en fonction des mouvements
    et du moment de la journée.
  triggers:
  - entity_id:
    - binary_sensor.outdoor_motion_sensor_motion
    to: 'on'
    alias: Un mouvement est détecté
    trigger: state
  - entity_id:
    - binary_sensor.outdoor_motion_sensor_motion
    to: 'off'
    for:
      hours: 0
      minutes: 3
      seconds: 0
    alias: Plus aucun mouvement n'est détecté pendant 3 minutes
    trigger: state
  conditions: []
  actions:
  - alias: Allumer ou éteindre le projecteur
    if:
    - condition: state
      entity_id: binary_sensor.outdoor_motion_sensor_motion
      state: 'on'
      alias: Si un mouvement est détecté
    then:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
      alias: Vérifier que le soleil est couché
    - condition: state
      entity_id: light.garage_wall_projector
      state: 'off'
      alias: Vérifier que le projecteur est éteint
    - metadata: {}
      data: {}
      target:
        entity_id: light.garage_wall_projector
      alias: Allumer le projecteur
      action: light.turn_on
    else:
    - condition: state
      entity_id: light.garage_wall_projector
      state: 'on'

- id: '1713547918574'
  alias: Zwave - Mise à jour de la position des volets
  description: Mettre à jour position volets quand la consommation devient nulle.
  triggers:
  - alias: Si la consommation d'un des volets devient nulle
    below: '0.1'
    entity_id:
    - sensor.ariane_bedroom_shutter_power
    - sensor.bathroom_shutter_power
    - sensor.bedroom_shutter_power
    - sensor.guest_room_shutter_power
    - sensor.kitchen_shutter_power
    - sensor.living_room_cemetery_shutter_power
    - sensor.living_room_front_left_shutter_power
    - sensor.living_room_front_right_shutter_power
    - sensor.living_room_garden_shutter_power
    - sensor.laundry_shutter_power
    - sensor.study_shutter_power
    - sensor.toilets_shutter_power
    - sensor.bathroom_shutter_power
    trigger: numeric_state
  conditions: []
  actions:
  - data:
      entity_id: "{% set device = device_id(trigger.entity_id) %} \n{% set entities
        = device_entities(device) %} \n{{ expand(entities) | selectattr(\"domain\",
        \"eq\", \"cover\") |\nmap(attribute=\"entity_id\") | first }}\n"
    alias: Mettre à jour la position du volet concerné
    action: zwave_js.refresh_value
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - data:
      entity_id: "{% set device = device_id(trigger.entity_id) %} \n{% set entities
        = device_entities(device) %} \n{{ expand(entities) | selectattr(\"domain\",
        \"eq\", \"cover\") |\nmap(attribute=\"entity_id\") | first }}\n"
    alias: Mettre à jour la position du volet concerné
    action: zwave_js.refresh_value
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - data:
      entity_id: "{% set device = device_id(trigger.entity_id) %} \n{% set entities
        = device_entities(device) %} \n{{ expand(entities) | selectattr(\"domain\",
        \"eq\", \"cover\") |\nmap(attribute=\"entity_id\") | first }}\n"
    alias: Mettre à jour la position du volet concerné
    action: zwave_js.refresh_value
  mode: parallel
  max: 15

- id: '1665214752087'
  alias: Poubelles - Passage
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.take_out_recyclable_garbage
    to: 'off'
  - trigger: state
    entity_id:
    - binary_sensor.take_out_non_recyclable_garbage
    to: 'off'
  conditions: []
  actions:
  - data: {}
    target:
      entity_id: input_boolean.garbage_out
    action: input_boolean.turn_off
  mode: single
- id: '1665214777980'
  alias: Poubelles - Rappel
  description: ''
  triggers:
  - at: '20:00'
    alias: À 20:00
    trigger: time
  - at: '23:00'
    alias: À 23:00
    trigger: time
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.take_out_non_recyclable_garbage
      state: 'on'
      alias: Si les ordures ménagères sont à sortir
    - condition: state
      entity_id: binary_sensor.take_out_recyclable_garbage
      state: 'on'
      alias: Si les poubelles recyclables sont à sortir
    alias: Si l'une des deux poubelles est à sortir
  - condition: state
    entity_id: input_boolean.garbage_out
    state: 'off'
    alias: Si les poubelles ne sont pas sorties
  actions:
  - variables:
      notification_message: "{% if is_state(\"binary_sensor.take_out_recyclable_garbage\",
        \"on\") %} C'est l'heure de sortir le recyclable ! ♻️ {% elif is_state(\"binary_sensor.take_out_non_recyclable_garbage\",
        \"on\") %} C'est l'heure de sortir les ordures ménagères ! \U0001F4A9 {% endif
        %}\n"
    alias: Définir du message à envoyer
  - if:
    - condition: state
      entity_id: person.paul
      state: home
      alias: Si Paul est à la maison
    then:
    - data:
        title: Poubelles
        message: '{{ notification_message }}'
        data:
          actions:
          - action: GARBAGE_OUT
            title: C'est fait
      alias: Envoyer une notification à Paul
      action: notify.mobile_app_iphone_de_paul
    alias: Envoyer un message à Paul s'il est à la maison
  - if:
    - condition: state
      entity_id: person.marina
      state: home
      alias: Si Marina est à la maison
    then:
    - data:
        title: Poubelles
        message: '{{ notification_message }}'
        data:
          actions:
          - action: GARBAGE_OUT
            title: C'est fait
      alias: Envoyer une notification à Marina
      action: notify.mobile_app_iphone_de_marina
    alias: Envoyer un message à Marina si elle est à la maison
  mode: single
- id: '1665214797596'
  alias: Poubelles - Sortie
  description: ''
  triggers:
  - event_type: mobile_app_notification_action
    event_data:
      action: GARBAGE_OUT
    alias: Quand l'action de la notification est cliqué
    trigger: event
  conditions: []
  actions:
  - data: {}
    alias: 'Lancer le script : Sortir les poubelles'
    enabled: true
    action: script.garbage_take_out
  mode: single
- id: '1665215615201'
  alias: Pilule - Prise
  description: Enregistre la date de la prise de la pilule
  triggers:
  - device_id: 2d2ec71c9d37745b99468aba1a0ae516
    domain: zha
    type: remote_button_short_press
    subtype: button
    trigger: device
  - device_id: 2d2ec71c9d37745b99468aba1a0ae516
    domain: zha
    type: remote_button_double_press
    subtype: button
    trigger: device
  - event_type: mobile_app_notification_action
    event_data:
      action: PILL_TAKEN
    trigger: event
  conditions: []
  actions:
  - data:
      data:
        tag: pill
      message: clear_notification
    alias: Supprimer la notification précédente
    action: notify.mobile_app_iphone_de_marina
  - data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    target:
      entity_id: input_datetime.last_pill_taken
    alias: Enregistrer la date de la prise de la pilule
    action: input_datetime.set_datetime
  mode: single
- id: '1665215646308'
  alias: Pilule - Rappel
  description: Envoyer un rappel pour la pilule jusqu'à ce qu'elle soit prise.
  triggers:
  - alias: Toutes les 30 minutes
    minutes: /10
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: binary_sensor.pill_notification
    state: 'on'
    alias: Si la pilule n'a pas été prise
  - condition: time
    after: '21:00:00'
    enabled: false
  - condition: state
    entity_id: person.marina
    state: home
    enabled: false
  actions:
  - data:
      data:
        tag: pill
      message: clear_notification
    alias: Supprimer la notification précédente
    action: notify.mobile_app_iphone_de_marina
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
    alias: Attendre 5 secondes
  - alias: Envoyer une notification à Marina
    data:
      title: Pilule
      message: "C'est l'heure de prendre la pilule \U0001F48A"
      data:
        tag: pill
        actions:
        - action: PILL_TAKEN
          title: Pilule prise
    action: notify.mobile_app_iphone_de_marina
  mode: single
- id: '1665216853678'
  alias: Armement de l'alarme
  description: Met l'alarme en mode absent si plus personne n'est à la maison.
  triggers:
  - event: start
    trigger: homeassistant
  - entity_id:
    - binary_sensor.home_presence
    to: 'off'
    alias: Quand la maison devient vide
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.home_alarm
      state: armed_away
      alias: L'alarme est en mode absent
    alias: L'alarme n'est pas en mode absent
  - condition: state
    entity_id: binary_sensor.home_presence
    state: 'off'
    alias: Personne à la maison
  actions:
  - data: {}
    target:
      entity_id: alarm_control_panel.home_alarm
    alias: Mettre l'alarme en mode absent
    action: alarm_control_panel.alarm_arm_away
  mode: single
- id: '1665216870012'
  alias: Désarmement de l'alarme
  description: Met l'alarme en mode présent si quelqu'un rentre à la maison.
  triggers:
  - event: start
    trigger: homeassistant
  - entity_id:
    - binary_sensor.home_presence
    to: 'on'
    alias: La maison devient occupée
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.home_alarm
      state: armed_home
      alias: L’alarme est en mode présent
    alias: L’alarme n'est pas en mode présent
  - alias: La maison n'est pas vide
    condition: state
    entity_id: binary_sensor.home_presence
    state: 'on'
  actions:
  - data: {}
    target:
      entity_id: alarm_control_panel.home_alarm
    alias: Mettre l'alarme en mode présent
    action: alarm_control_panel.alarm_arm_home
  mode: single
- id: '1665588582897'
  alias: Volet Buanderie - Télécommande
  description: Contrôle du volet de la buanderie avec la télécommande.
  triggers:
  - device_id: 75b18d9e893fc853ade15e69377a6906
    domain: zha
    type: remote_button_long_press
    subtype: dim_down
    id: down
    trigger: device
  - device_id: 75b18d9e893fc853ade15e69377a6906
    domain: zha
    type: remote_button_long_press
    subtype: dim_up
    id: up
    trigger: device
  - device_id: 75b18d9e893fc853ade15e69377a6906
    domain: zha
    type: remote_button_short_press
    subtype: turn_on
    id: stop
    trigger: device
  - device_id: 75b18d9e893fc853ade15e69377a6906
    domain: zha
    type: remote_button_short_press
    subtype: turn_off
    id: stop
    trigger: device
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: down
      sequence:
      - data: {}
        target:
          entity_id: cover.laundry_shutter
        action: cover.close_cover
    - conditions:
      - condition: trigger
        id: up
      sequence:
      - data: {}
        target:
          entity_id: cover.laundry_shutter
        action: cover.open_cover
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - data: {}
        target:
          entity_id: cover.laundry_shutter
        action: cover.stop_cover
    default: []
  mode: restart
- id: '1666680559161'
  alias: Lumière extérieure - Rentre Maison
  description: Allume la lumière extérieure quand quelqu'un rentre à la maison
  triggers:
  - entity_id: person.paul
    zone: zone.home
    event: enter
    alias: Quand Paul rentre à la maison
    trigger: zone
  - entity_id: person.marina
    zone: zone.home
    event: enter
    alias: Quand Marina rentre à la maison
    trigger: zone
  conditions:
  - condition: or
    conditions:
    - condition: sun
      before: sunrise
      before_offset: 00:15:00
      alias: Avant le lever du soleil
    - condition: sun
      after: sunset
      after_offset: -00:15:00
      alias: Après 15 minutes avant le coucher du soleil
    alias: S'il fait noir
  actions:
  - data:
      brightness_pct: 100
    target:
      entity_id: light.outdoor_light
    alias: Allumer la lumière extérieure
    action: light.turn_on
  - delay:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - data: {}
    target:
      entity_id: light.outdoor_light
    alias: Éteindre la lumière extérieure
    action: light.turn_off
  mode: single
- id: '1666725343502'
  alias: TV - Lumière Cinéma
  description: Ajuste les lumières du salon lors du visionnage d'un film ou d'une
    série
  triggers:
  - entity_id:
    - media_player.plex_apple_tv
    - media_player.plex_shield_tv
    to: playing
    id: played
    trigger: state
  - entity_id:
    - media_player.plex_apple_tv
    - media_player.plex_shield_tv
    from: playing
    id: stopped
    trigger: state
  - entity_id: input_select.cinema_mode
    id: change_mode
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: sun
      before: sunrise
    - condition: sun
      after: sunset
    enabled: true
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: change_mode
      sequence:
      - condition: or
        conditions:
        - condition: state
          entity_id: media_player.plex_apple_tv
          state: playing
        - condition: state
          entity_id: media_player.plex_shield_tv
          state: playing
      - data:
          transition_duration: 1
        action: script.play_cinema_mode_scene
    - conditions:
      - condition: trigger
        id: played
      sequence:
      - data:
          transition_duration: 1
        action: script.play_cinema_mode_scene
    - conditions:
      - condition: trigger
        id: stopped
      sequence:
      - condition: not
        conditions:
        - condition: state
          entity_id: input_select.cinema_mode
          state: Désactivé
      - target:
          entity_id: scene.living_room_cosy
        data:
          transition: 10
        action: scene.turn_on
    default: []
  mode: single
- id: '1667026554816'
  alias: Lumière extérieure - Quitte maison
  description: Éteins la lumière quand tout le monde part de la maison
  triggers:
  - entity_id: person.paul
    zone: zone.home
    event: leave
    id: paul
    alias: Quand Paul part de la maison
    trigger: zone
  - entity_id: person.marina
    zone: zone.home
    event: leave
    id: marina
    alias: Quand Marina part de la maison
    trigger: zone
  conditions:
  - alias: Si la lumière extérieure est allumée
    condition: state
    entity_id: light.all
    state: 'on'
  actions:
  - data: {}
    target:
      entity_id: light.outdoor_light
    alias: Éteindre la lumière extérieure
    action: light.turn_off
  mode: single
- id: '1671025138801'
  alias: Notification thermostats trop chauds
  description: ''
  triggers:
  - alias: Quand la température du thermostat du rez-de-chaussée dépasse 23°C
    entity_id:
    - climate.ground_floor_thermostat
    attribute: temperature
    above: 23
    trigger: numeric_state
  - alias: Quand la température du thermostat de l'étage dépasse 23°C
    entity_id:
    - climate.first_floor_thermostat
    attribute: temperature
    above: 23
    trigger: numeric_state
  conditions:
  - condition: state
    entity_id: climate.heat_pump
    state: heat
  actions:
  - data:
      message: "\U0001F640 {{ trigger.to_state.attributes.friendly_name }} est réglé
        sur {{ trigger.to_state.attributes.temperature }}°C \U0001F525"
    alias: Envoyer une notification à Paul
    action: notify.mobile_app_iphone_de_paul
  - data:
      message: "\U0001F640 {{ trigger.to_state.attributes.friendly_name }} est réglé
        sur {{ trigger.to_state.attributes.temperature }}°C \U0001F525"
    alias: Envoyer une notification à Marina
    action: notify.mobile_app_iphone_de_marina
  mode: single
- id: '1671531189627'
  alias: Volet Chambre d'amis - Mode invité
  description: ''
  triggers:
  - entity_id:
    - cover.guest_room_shutter
    trigger: state
  - entity_id:
    - input_boolean.guest_mode
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: 'on'
    then:
    - if:
      - condition: state
        entity_id: cover.guest_room_shutter
        state: closed
      then:
      - data:
          option: NoControl
        target:
          entity_id: select.guest_room_shutter_rf_protection_state
        action: select.select_option
      else:
      - data:
          option: Unprotected
        target:
          entity_id: select.guest_room_shutter_rf_protection_state
        action: select.select_option
    else:
    - data:
        option: Unprotected
      target:
        entity_id: select.guest_room_shutter_rf_protection_state
      action: select.select_option
  mode: single
- id: '1683749684693'
  alias: Filtration Automatique - Spa
  description: Active et désactive automatiquement la filtration du spa à des heures
    spécifiques, garantissant une eau toujours propre et fraîche. La filtration commence
    à 21h02 et s'arrête à 5h02.
  triggers:
  - at: '21:02:00'
    id: start
    trigger: time
  - at: 05:02:00
    id: stop
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - data: {}
        target:
          entity_id: switch.spa_filter
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - data: {}
        target:
          entity_id: switch.spa_filter
        action: switch.turn_off
    default: []
  mode: restart
- id: '1684017273421'
  alias: Chauffage programmé du spa
  description: ''
  triggers:
  - at: 05:00:00
    trigger: time
  conditions: []
  actions:
  - metadata: {}
    data:
      hvac_mode: heat
    target:
      entity_id: climate.spa_thermostat
    action: climate.set_hvac_mode
  mode: single
- id: '1685859197705'
  alias: Sauvegarde quotidienne
  description: ''
  triggers:
  - at: 03:15:00
    trigger: time
  conditions: []
  actions:
  - data:
      compressed: true
      location: Ananas
      name: '{{ now().strftime(''Backup %Y-%m-%d %H:%M'') }}'
    enabled: true
    action: hassio.backup_full
  - metadata: {}
    data:
      compressed: true
      homeassistant: true
      addons:
      - core_mosquitto
      - core_matter_server
      - core_openwakeword
      - a0d7b954_zwavejs2mqtt
      - 402f1039_eufy_security_ws
      - 5c53de3b_esphome
      folders:
      - addons/local
      - media
      - share
      - ssl
      location: Ananas
      name: '{{ now().strftime(''Backup %Y-%m-%d %H:%M'') }}'
    enabled: false
    action: hassio.backup_partial
  mode: single
- id: '1688142384244'
  alias: Lumière automatique Garage
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.garage_occupancy
    to:
    trigger: state
  - entity_id:
    - sensor.garage_presence_sensor_illuminance
    below: 85
    trigger: numeric_state
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: binary_sensor.home_presence
    state: 'on'
  - condition: state
    entity_id: input_boolean.cat_garage_mode
    state: 'off'
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.garage_occupancy
      state: 'on'
    then:
    - condition: state
      entity_id: light.garage_light
      state: 'off'
    - condition: or
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: light.garage_light
          state: 'off'
          for:
            hours: 0
            minutes: 1
            seconds: 0
      - condition: numeric_state
        entity_id: sensor.garage_presence_sensor_illuminance
        below: 85
    - data: {}
      target:
        entity_id: light.garage_light
      action: light.turn_on
    else:
    - condition: state
      entity_id: light.garage_light
      state: 'on'
    - data: {}
      target:
        entity_id: light.garage_light
      action: light.turn_off
  mode: single

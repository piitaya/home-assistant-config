- id: '1746713957987'
  alias: Tondeuse - Reprise de tonte
  description: Reprend la tonte du robot quand la batterie est suffisante.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.yuka_mini_batterie
    above: sensor.yuka_mini_batterie_pour_finir
    for:
      hours: 0
      minutes: 2
      seconds: 0
  - trigger: homeassistant
    event: start
  conditions:
  - condition: numeric_state
    entity_id: sensor.yuka_mini_batterie
    above: sensor.yuka_mini_batterie_pour_finir
  - condition: numeric_state
    entity_id: sensor.yuka_mini_progression
    above: 50
    below: 100
  - condition: battery.is_charging
    target:
      entity_id: binary_sensor.yuka_mini_en_charge
    options:
      behavior: any
      for: 00:00:00
  - condition: lawn_mower.is_paused
    target:
      entity_id: lawn_mower.yuka_mini
    options:
      behavior: any
      for: 00:00:00
  actions:
  - repeat:
      sequence:
      - action: lawn_mower.start_mowing
        metadata: {}
        data: {}
        target:
          entity_id: lawn_mower.yuka_mini
        continue_on_error: true
      - delay:
          seconds: 30
      until:
      - condition: or
        conditions:
        - condition: lawn_mower.is_mowing
          target:
            entity_id: lawn_mower.yuka_mini
          options:
            behavior: any
            for: 00:00:00
        - condition: template
          value_template: '{{ repeat.index >= 5 }}'
  - if:
    - condition: not
      conditions:
      - condition: lawn_mower.is_mowing
        target:
          entity_id: lawn_mower.yuka_mini
        options:
          behavior: any
          for: 00:00:00
    then:
    - action: notify.mobile_app_iphone_de_paul
      metadata: {}
      data:
        title: Tondeuse
        message: Impossible de reprendre la tonte après 5 essais (erreur Bluetooth
          ?).
  mode: single

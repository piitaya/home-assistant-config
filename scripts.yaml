garbage_take_out:
  alias: Sortir les poubelles
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.take_out_non_recyclable_garbage
      state: 'off'
    - condition: state
      entity_id: binary_sensor.take_out_recyclable_garbage
      state: 'off'
    then:
    - stop: Pas besoin de sortir les poubelles
    enabled: true
  - if:
    - condition: state
      entity_id: input_boolean.garbage_out
      state: 'on'
    then:
    - stop: Poubelles déjà sorties
    enabled: true
  - service: input_boolean.turn_on
    data: {}
    target:
      entity_id: input_boolean.garbage_out
  mode: restart
  icon: mdi:delete-empty
clean_ground_floor_selected_rooms:
  alias: Nettoyer les pièces sélectionnées (Alfred)
  sequence:
  - alias: Passer l'aspirateur dans les pièces sélectionnées
    if:
    - alias: Si au moins une pièce est sélectionnée
      condition: numeric_state
      entity_id: sensor.pieces_selectionnees_alfred
      above: '0'
    then:
    - alias: Passer l'aspirateur dans les pièces sélectionnées
      action: vacuum.clean_area
      target:
        entity_id:
        - vacuum.alfred
      data:
        cleaning_area_id: '{{ state_attr(''sensor.pieces_selectionnees_alfred'', ''area_ids'')
          }}'
      enabled: true
  - alias: Désélectionner toutes les pièces
    data: {}
    target:
      entity_id: "{{ expand(states.input_boolean)  \n    | selectattr('attributes.vacuum_name',
        'eq', 'alfred')\n    | map(attribute='entity_id') \n    | list \n}}\n"
    action: input_boolean.turn_off
  mode: single
  icon: mdi:vacuum
clean_first_floor_selected_rooms:
  alias: Nettoyer les pièces sélectionnées (Edgar)
  sequence:
  - alias: Passer l'aspirateur dans les pièces sélectionnées
    if:
    - alias: Si au moins une pièce est sélectionnée
      condition: numeric_state
      entity_id: sensor.pieces_selectionnees_edgar
      above: '0'
    then:
    - alias: Passer l'aspirateur dans les pièces sélectionnées
      action: vacuum.clean_area
      target:
        entity_id:
        - vacuum.edgar
      data:
        cleaning_area_id: '{{ state_attr(''sensor.pieces_selectionnees_edgar'', ''area_ids'')
          }}'
      enabled: true
  - alias: Désélectionner toutes les pièces
    data: {}
    target:
      entity_id: "{{ expand(states.input_boolean)  \n    | selectattr('attributes.vacuum_name',
        'eq', 'edgar')\n    | map(attribute='entity_id') \n    | list \n}}\n"
    action: input_boolean.turn_off
  mode: single
  icon: mdi:vacuum
play_cinema_mode_scene:
  alias: Jouer la scene correspond au mode cinéma
  fields:
    transition_duration:
      name: Transition
      description: Durée de la transition de la scene
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: secondes
          mode: slider
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.cinema_mode
        state: Tamisé
      sequence:
      - target:
          entity_id: scene.cinema_dim
        data:
          transition: '{{ transition_duration }}'
        action: scene.turn_on
    - conditions:
      - condition: state
        entity_id: input_select.cinema_mode
        state: Noir complet
      sequence:
      - data:
          transition: '{{ transition_duration }}'
        target:
          entity_id: scene.cinema_black
        action: scene.turn_on
    default: []
  mode: single
  icon: mdi:theater
lights_during_play:
  alias: Régler les lumières durant la lecture
  sequence:
  - service: light.turn_off
    data:
      transition: 1
    alias: Éteindre la lumière du salon
    target:
      entity_id:
      - light.living_room_ceiling_light
      - light.living_room_sideboard_lamp
      - light.living_room_floor_lamp
      - light.dining_room_ceiling_light
  mode: single
  icon: mdi:television-play
lights_during_pause:
  alias: Régler les lumières durant la pause
  sequence:
  - parallel:
    - service: light.turn_on
      data:
        transition: 2
        brightness_pct: 60
      target:
        entity_id: light.living_room_floor_lamp
      alias: Allumer la lampe sur pied à 60%
    - service: light.turn_on
      data:
        transition: 10
        brightness_pct: 30
      target:
        entity_id: light.living_room_sideboard_lamp
      alias: Allumer la lampe du buffet à 30%
    alias: En parallèle
  mode: single
  icon: mdi:television-pause
lights_after_play:
  alias: Régler les lumières après la lecture
  sequence:
  - parallel:
    - service: light.turn_on
      data:
        transition: 10
        brightness_pct: 100
      target:
        entity_id: light.living_room_floor_lamp
      alias: Allumer la lampe sur pied à 100%
    - service: light.turn_on
      data:
        transition: 10
        brightness_pct: 40
      target:
        entity_id: light.living_room_sideboard_lamp
      alias: Allumer la lampe du buffet à 40%
    - service: light.turn_on
      data:
        transition: 10
        brightness_pct: 60
      target:
        entity_id: light.living_room_ceiling_light
      alias: Allumer les spots du salon 60%
    alias: En parallèle
  mode: single
  icon: mdi:television-stop
set_cover_for_cat:
  alias: Régler les volets pour le chat
  sequence:
  - service: cover.set_cover_position
    data:
      position: 30
    target:
      entity_id:
      - cover.living_room_cemetery_shutter
      - cover.living_room_garden_shutter
  mode: single
france_inter:
  alias: France Inter
  sequence:
  - if:
    - condition: state
      entity_id: media_player.kitchen_homepod
      state: playing
    then:
    - service: media_player.media_stop
      target:
        entity_id:
        - media_player.kitchen_homepod
      data: {}
    else:
    - service: media_player.play_media
      target:
        entity_id: media_player.kitchen_homepod
      data:
        media_content_id: media-source://radio_browser/71ab8906-a508-4f98-a498-8840b41b79d5
        media_content_type: audio/mpeg
      metadata:
        title: France Inter
        thumbnail: https://www.radiofrance.fr/client/immutable/assets/franceinter.8675ea98.svg#franceinter-square
        media_class: music
        children_media_class:
        navigateIds:
        - {}
        - media_content_type: app
          media_content_id: media-source://radio_browser
        - media_content_type: music
          media_content_id: media-source://radio_browser/country/FR
  mode: parallel
  icon: mdi:radio
coucher_sieste_ariane:
  alias: Coucher/Sieste Ariane
  sequence:
  - condition: state
    entity_id: cover.ariane_bedroom_shutter
    state: open
  - parallel:
    - metadata: {}
      data: {}
      target:
        floor_id: first_floor
      action: cover.close_cover
    - metadata: {}
      data:
        brightness_pct: 100
      target:
        entity_id:
        - light.ariane_bedroom_bedside_lamp
        - light.bureau_spots
      action: light.turn_on
  description: ''
regler_la_pergola_en_position_soleil:
  alias: Régler la pergola en position soleil
  sequence:
  - target:
      entity_id: cover.pergola
    data:
      tilt_position: '{{ states(''sensor.pergola_sun_slat_tilt'') | int(0) }}'
    action: cover.set_cover_tilt_position
  description: ''
  icon: cil:sun-angle
ouvrir_les_lames_de_la_pergola:
  alias: Ouvrir les lames de la pergola
  sequence:
  - action: cover.set_cover_tilt_position
    target:
      entity_id: cover.pergola
    data:
      tilt_position: 55
  description: ''
  icon: mush:pergola-blade-open
fermer_les_lames_de_la_pergola:
  alias: Fermer les lames de la pergola
  sequence:
  - target:
      entity_id: cover.pergola
    action: cover.close_cover_tilt
    data: {}
  description: ''
  icon: mush:pergola-blade-closed

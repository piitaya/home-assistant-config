bulletin_meteo_quotidien:
  sequence:
  - action: input_text.set_value
    metadata: {}
    target:
      entity_id: input_text.bulletin_meteo
    data:
      value: ''
  - action: weather.get_forecasts
    data:
      type: hourly
    target:
      entity_id: weather.nieppe
    response_variable: forecast
  - action: ai_task.generate_data
    metadata: {}
    data:
      entity_id: ai_task.home_assistant_cloud_ai
      instructions: "L'heure actuelle est: {{now()}}\n\nResume la météo pour le reste
        de la journée en une phrase de moins de 150 caractères : \n- ne parle du vent
        QUE S'IL est supérieur a 50 km/h sinon, N'EN PARLES PAS !\n- indique la période
        de la journée\n- indique toujours la pluie et la/les températures\n- ajoute
        un émoji la fin\n\nLes previsions météorologiques sont: {{forecast}}"
      task_name: Bulletin Méteo
    response_variable: report
  - action: input_text.set_value
    metadata: {}
    target:
      entity_id: input_text.bulletin_meteo
    data:
      value: '{{ report.data }}'
  alias: Bulletin Météo Quotidien
  description: Génère un mini bulletin météo pour afficher sur le dashboard en haut,
    en utilisant les prévisions horaires.
notifier_erreur_machine_a_cafe:

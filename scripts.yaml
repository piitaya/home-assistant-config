      notification_data_advanced: {}
      default_message: La machine a café est en erreur
      default_importance: false
      default_title: Erreur machine à café
  description: Ce script génère une notification en cas d'erreur détectée sur la machine
    à café.
  icon: mdi:coffee-maker

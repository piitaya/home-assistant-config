http_request:
  useragent: "ESPHome/BambuReader"
  timeout: 10s

text:
  - platform: template
    id: spoolman_url
    name: "Spoolman URL"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (id(spoolman_enabled).state) {
            lv_label_set_text(id(lbl_sync_icon), "\U000F04E6");
            lv_obj_set_style_text_color(id(lbl_sync_icon), lv_color_hex(0x00AE42), 0);
          }

switch:
  - platform: template
    id: spoolman_enabled
    name: "Spoolman sync"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - lvgl.label.update:
            id: lbl_sync_icon
            text: "\U000F04E6"
            text_color: 0x00AE42
    on_turn_off:
      then:
        - lvgl.label.update:
            id: lbl_sync_icon
            text: "\U000F04E8"
            text_color: 0x555555

globals:
  - id: sm_vendor_id
    type: int
    initial_value: "0"
  - id: sm_filament_id
    type: int
    initial_value: "0"
  - id: sm_spool_found
    type: bool
    initial_value: "false"
  - id: sm_filament_found
    type: bool
    initial_value: "false"
  - id: sm_error
    type: bool
    initial_value: "false"
  - id: sm_tray_uid
    type: std::string
    initial_value: '""'
  - id: sm_material
    type: std::string
    initial_value: '""'
  - id: sm_color_hex
    type: std::string
    initial_value: '""'
  - id: sm_color_name
    type: std::string
    initial_value: '""'
  - id: sm_density
    type: float
    initial_value: "0"
  - id: sm_diameter
    type: float
    initial_value: "0"
  - id: sm_weight
    type: float
    initial_value: "0"
  - id: sm_hotend_min
    type: float
    initial_value: "0"
  - id: sm_hotend_max
    type: float
    initial_value: "0"
  - id: sm_bed_temp
    type: float
    initial_value: "0"

sensor:
  - platform: template
    id: sm_remaining_weight
    name: "Poids restant"
    unit_of_measurement: "g"
    icon: mdi:weight-gram
    accuracy_decimals: 0

script:
  - id: spoolman_sync
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (!id(spoolman_enabled).state) return false;
              auto url = id(spoolman_url).state;
              return !url.empty() && url.find("http") == 0;
          then:
            - lambda: |-
                ESP_LOGI("spoolman", "Début sync Spoolman...");
                id(sm_spool_found) = false;
                id(sm_filament_found) = false;
                id(sm_filament_id) = 0;
                id(sm_error) = false;
                id(sm_tray_uid) = id(tray_uid_sens).state;
                id(sm_material) = id(filament_type_sens).state;
                id(sm_color_hex) = id(filament_color_sens).state;
                if (id(sm_color_hex).length() > 0 && id(sm_color_hex)[0] == '#')
                  id(sm_color_hex) = id(sm_color_hex).substr(1);
                id(sm_color_name) = id(filament_color_name_sens).state;
                id(sm_density) = id(material_density_sens).state;
                id(sm_diameter) = id(filament_diameter_sens).state;
                id(sm_weight) = id(spool_weight_sens).state;
                id(sm_hotend_min) = id(min_hotend_temp_sens).state;
                id(sm_hotend_max) = id(max_hotend_temp_sens).state;
                id(sm_bed_temp) = id(bed_temp_sens).state;
                ESP_LOGI("spoolman", "Tag: %s | %s | %s", id(sm_tray_uid).c_str(), id(sm_material).c_str(), id(sm_color_name).c_str());
            - delay: 500ms

            # 1. Chercher le tag dans les spools du même material
            - http_request.get:
                url: !lambda |-
                  std::string material = id(sm_material);
                  std::string encoded;
                  for (char c : material) {
                    if (c == ' ') encoded += "%20";
                    else encoded += c;
                  }
                  return id(spoolman_url).state + "/api/v1/spool?filament.material=" + encoded + "&allow_archived=true";
                capture_response: true
                max_response_buffer_size: 524288
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("spoolman", "GET spools failed: %d", response->status_code);
                          id(sm_error) = true;
                          return;
                        }
                        std::string tray = id(sm_tray_uid);
                        size_t tray_pos = body.find(tray);
                        if (tray_pos != std::string::npos) {
                          id(sm_spool_found) = true;
                          std::string search = body.substr(0, tray_pos);
                          // Vérifier si archivée
                          size_t arch_pos = search.rfind("\"archived\":");
                          bool archived = (arch_pos != std::string::npos &&
                            search.substr(arch_pos + 11, 4) == "true");
                          if (archived) {
                            lv_label_set_text(id(lbl_remaining), "Archivée");
                            lv_obj_set_style_text_color(id(lbl_remaining),
                              lv_color_hex(id(color_lum) > 0.5f ? 0x000000 : 0xFFFFFF), 0);
                            lv_label_set_text(id(lbl_detail_remaining), "-");
                            ESP_LOGI("spoolman", "Bobine %s trouvée — archivée", tray.c_str());
                          } else {
                            size_t rw_pos = search.rfind("\"remaining_weight\":");
                            if (rw_pos != std::string::npos) {
                              float rw = atof(search.c_str() + rw_pos + 19);
                              id(sm_remaining_weight).publish_state(rw);
                              char buf[16];
                              snprintf(buf, sizeof(buf), "%.0f g", rw);
                              lv_label_set_text(id(lbl_remaining), buf);
                              lv_obj_set_style_text_color(id(lbl_remaining),
                                lv_color_hex(id(color_lum) > 0.5f ? 0x000000 : 0xFFFFFF), 0);
                              lv_label_set_text(id(lbl_detail_remaining), buf);
                              ESP_LOGI("spoolman", "Bobine %s trouvée — restant: %.0fg", tray.c_str(), rw);
                            } else {
                              lv_label_set_text(id(lbl_remaining), "Inconnu");
                              lv_obj_set_style_text_color(id(lbl_remaining),
                                lv_color_hex(id(color_lum) > 0.5f ? 0x000000 : 0xFFFFFF), 0);
                              lv_label_set_text(id(lbl_detail_remaining), "Inconnu");
                              ESP_LOGI("spoolman", "Bobine %s trouvée", tray.c_str());
                            }
                          }
                        } else {
                          id(sm_remaining_weight).publish_state(NAN);
                        }

            # 2. Si erreur ou bobine trouvée → terminé
            - if:
                condition:
                  lambda: 'return id(sm_error) || id(sm_spool_found);'
                then:
                  - logger.log:
                      level: INFO
                      tag: spoolman
                      format: "Sync terminée — bobine existante"
                else:
                  # 3. Chercher le filament par material + color
                  - http_request.get:
                      url: !lambda |-
                        std::string material = id(sm_material);
                        std::string encoded;
                        for (char c : material) {
                          if (c == ' ') encoded += "%20";
                          else encoded += c;
                        }
                        return id(spoolman_url).state + "/api/v1/filament?material=" +
                          encoded + "&color_hex=" + id(sm_color_hex);
                      capture_response: true
                      max_response_buffer_size: 4096
                      on_response:
                        then:
                          - lambda: |-
                              if (response->status_code != 200) {
                                ESP_LOGW("spoolman", "GET filaments failed: %d", response->status_code);
                                id(sm_error) = true;
                                return;
                              }
                              if (body.length() > 2 && body != "[]") {
                                size_t pos = body.find("\"id\":");
                                if (pos != std::string::npos) {
                                  int fid = atoi(body.c_str() + pos + 5);
                                  if (fid > 0) {
                                    id(sm_filament_id) = fid;
                                    id(sm_filament_found) = true;
                                    ESP_LOGI("spoolman", "Filament trouvé: id=%d", fid);
                                  }
                                }
                              }

                  # 4. Créer le filament si inexistant
                  - if:
                      condition:
                        lambda: 'return !id(sm_filament_found) && !id(sm_error);'
                      then:
                        # Chercher/créer le vendor "Bambu Lab"
                        - lambda: 'id(sm_vendor_id) = 0;'
                        - http_request.get:
                            url: !lambda 'return id(spoolman_url).state + "/api/v1/vendor?name=Bambu%20Lab";'
                            capture_response: true
                            max_response_buffer_size: 2048
                            on_response:
                              then:
                                - lambda: |-
                                    if (response->status_code == 200 && body.length() > 2 && body != "[]") {
                                      size_t pos = body.find("\"id\":");
                                      if (pos != std::string::npos) {
                                        int vid = atoi(body.c_str() + pos + 5);
                                        if (vid > 0) {
                                          id(sm_vendor_id) = vid;
                                          ESP_LOGI("spoolman", "Vendor Bambu Lab trouvé: id=%d", vid);
                                        }
                                      }
                                    }
                        - if:
                            condition:
                              lambda: 'return id(sm_vendor_id) == 0;'
                            then:
                              - http_request.post:
                                  url: !lambda 'return id(spoolman_url).state + "/api/v1/vendor";'
                                  request_headers:
                                    Content-Type: application/json
                                  json: |-
                                    root["name"] = "Bambu Lab";
                                  capture_response: true
                                  max_response_buffer_size: 1024
                                  on_response:
                                    then:
                                      - lambda: |-
                                          if (response->status_code == 200 || response->status_code == 201) {
                                            size_t pos = body.find("\"id\":");
                                            if (pos != std::string::npos) {
                                              int vid = atoi(body.c_str() + pos + 5);
                                              if (vid > 0) {
                                                id(sm_vendor_id) = vid;
                                                ESP_LOGI("spoolman", "Vendor Bambu Lab créé: id=%d", vid);
                                              }
                                            }
                                          } else {
                                            ESP_LOGW("spoolman", "POST vendor failed: %d", response->status_code);
                                          }
                        # Créer le filament
                        - http_request.post:
                            url: !lambda 'return id(spoolman_url).state + "/api/v1/filament";'
                            request_headers:
                              Content-Type: application/json
                            json: |-
                              root["name"] = id(sm_color_name);
                              root["material"] = id(sm_material);
                              if (id(sm_vendor_id) > 0) root["vendor_id"] = id(sm_vendor_id);
                              root["color_hex"] = id(sm_color_hex);
                              root["density"] = id(sm_density);
                              root["diameter"] = id(sm_diameter);
                              root["weight"] = id(sm_weight);
                              root["spool_weight"] = 250;
                              root["settings_extruder_temp"] = (int)((id(sm_hotend_min) + id(sm_hotend_max)) / 2);
                              root["settings_bed_temp"] = (int)id(sm_bed_temp);
                            capture_response: true
                            max_response_buffer_size: 2048
                            on_response:
                              then:
                                - lambda: |-
                                    if (response->status_code == 200 || response->status_code == 201) {
                                      size_t pos = body.find("\"id\":");
                                      if (pos != std::string::npos) {
                                        int fid = atoi(body.c_str() + pos + 5);
                                        id(sm_filament_id) = fid;
                                        ESP_LOGI("spoolman", "Filament créé: id=%d", fid);
                                      }
                                    } else {
                                      ESP_LOGW("spoolman", "POST filament failed: %d", response->status_code);
                                    }

                  # 5. Créer le spool
                  - if:
                      condition:
                        lambda: 'return id(sm_filament_id) > 0 && !id(sm_error);'
                      then:
                        - http_request.post:
                            url: !lambda 'return id(spoolman_url).state + "/api/v1/spool";'
                            request_headers:
                              Content-Type: application/json
                            json: |-
                              root["filament_id"] = id(sm_filament_id);
                              root["remaining_weight"] = id(sm_weight);
                              JsonObject extra = root["extra"].to<JsonObject>();
                              extra["tag"] = "\"" + id(sm_tray_uid) + "\"";
                            capture_response: true
                            max_response_buffer_size: 1024
                            on_response:
                              then:
                                - lambda: |-
                                    if (response->status_code == 200 || response->status_code == 201) {
                                      lv_label_set_text(id(lbl_remaining), "Nouvelle");
                                      lv_obj_set_style_text_color(id(lbl_remaining),
                                        lv_color_hex(id(color_lum) > 0.5f ? 0x000000 : 0xFFFFFF), 0);
                                      lv_label_set_text(id(lbl_detail_remaining), "-");
                                      ESP_LOGI("spoolman", "Bobine créée: %s (%s)",
                                        id(sm_color_name).c_str(),
                                        id(sm_material).c_str());
                                    } else {
                                      ESP_LOGW("spoolman", "POST spool failed: %d — %s", response->status_code, body.c_str());
                                    }
                      else:
                        - logger.log:
                            level: WARN
                            tag: spoolman
                            format: "Impossible de créer la bobine — filament_id manquant"

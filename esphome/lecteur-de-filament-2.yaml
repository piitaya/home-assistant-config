substitutions:
  name: lecteur-de-filament-2
  friendly_name: Lecteur de filament 2

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

logger:

api:
  encryption:
    key: !secret lecteur_de_filament_2_api_encryption_key

ota:
  - platform: esphome
    password: !secret lecteur_de_filament_2_ota_password

packages:
  wifi: !include common/wifi.yaml
  board: !include lecteur-de-filament-2/board.yaml
  power: !include lecteur-de-filament-2/power.yaml
  display: !include lecteur-de-filament-2/display.yaml
  fonts: !include lecteur-de-filament-2/fonts.yaml
  nfc: !include lecteur-de-filament-2/nfc.yaml
  styles: !include lecteur-de-filament-2/styles.yaml
  page_idle: !include lecteur-de-filament-2/page_idle.yaml
  page_filament: !include lecteur-de-filament-2/page_filament.yaml
  page_details: !include lecteur-de-filament-2/page_details.yaml
  triggers: !include lecteur-de-filament-2/triggers.yaml

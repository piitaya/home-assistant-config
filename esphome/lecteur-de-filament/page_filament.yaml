lvgl:
  pages:
    - id: page_filament
      styles: style_page
      widgets:
        # Bandeau couleur
        - obj:
            id: color_banner
            x: 0
            y: 0
            width: 240
            height: 200
            radius: 0
            bg_color: 0x808080
            bg_opa: COVER
            border_width: 0
            scrollbar_mode: "OFF"
            clickable: false
            pad_all: 0
            widgets:
              # Cercle foncé
              - obj:
                  id: color_circle
                  align: CENTER
                  y: -25
                  width: 90
                  height: 90
                  radius: 45
                  bg_color: 0x606060
                  bg_opa: COVER
                  border_width: 3
                  border_color: 0x909090
                  scrollbar_mode: "OFF"
              # Type espacé
              - label:
                  id: lbl_type_spaced
                  align: CENTER
                  y: 40
                  width: 220
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: font_small
                  text_align: CENTER
              # Nom couleur
              - label:
                  id: lbl_color_name
                  align: CENTER
                  y: 58
                  width: 220
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: font_large
                  text_align: CENTER
              # Poids restant Spoolman
              - label:
                  id: lbl_remaining
                  align: CENTER
                  y: 80
                  width: 220
                  text: ""
                  text_color: 0xFFFFFF
                  text_font: font_small
                  text_align: CENTER
        # Bouton Détails (pleine largeur, sans BSS)
        - obj:
            id: btn_details_full
            x: 16
            y: 212
            width: 208
            height: 42
            styles: style_btn_dark
            on_press:
              then:
                - lvgl.page.show: page_details
            widgets:
              - label:
                  align: LEFT_MID
                  text: "Détails"
                  text_color: 0xFFFFFF
                  text_font: font_small
              - label:
                  align: RIGHT_MID
                  text: "\U000F0142"
                  text_color: 0x888888
                  text_font: font_small
        # Bouton Détails (petit, avec BSS)
        - obj:
            id: btn_details_small
            x: 16
            y: 212
            width: 100
            height: 42
            styles: style_btn_dark
            hidden: true
            on_press:
              then:
                - lvgl.page.show: page_details
            widgets:
              - label:
                  align: LEFT_MID
                  text: "Détails"
                  text_color: 0xFFFFFF
                  text_font: font_small
              - label:
                  align: RIGHT_MID
                  text: "\U000F0142"
                  text_color: 0x888888
                  text_font: font_small
        # Bouton Ajouter
        - obj:
            id: btn_add
            x: 124
            y: 212
            width: 100
            height: 42
            styles: style_btn_dark
            hidden: true
            on_press:
              then:
                - script.execute: bss_put
            widgets:
              - label:
                  align: LEFT_MID
                  text: "Ajouter"
                  text_color: 0xFFFFFF
                  text_font: font_small
              - label:
                  align: RIGHT_MID
                  text: "\U000F0415"
                  text_color: 0x888888
                  text_font: font_small
        # Bouton Enregistrée (disabled)
        - obj:
            id: btn_registered
            x: 124
            y: 212
            width: 100
            height: 42
            styles: style_btn_dark
            hidden: true
            clickable: false
            widgets:
              - label:
                  align: CENTER
                  text: "Enregistrée"
                  text_color: 0x888888
                  text_font: font_small
        # Bouton Nouveau scan
        - obj:
            align: BOTTOM_MID
            y: -12
            width: 208
            height: 42
            styles: style_btn_outline_green
            on_press:
              then:
                - lvgl.page.show: page_idle
            widgets:
              - label:
                  align: CENTER
                  text: "Nouveau scan"
                  text_color: 0x00AE42
                  text_font: font_small

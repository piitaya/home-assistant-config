globals:
  - id: pwr_state
    type: uint8_t
    initial_value: "0"
  - id: pwr_long_press
    type: uint16_t
    initial_value: "0"

interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(pwr_state)) return;
          if (!gpio_get_level(GPIO_NUM_6)) {
            if (id(pwr_state) == 2) {
              id(pwr_long_press) += 1;
              if (id(pwr_long_press) >= 20) {
                gpio_set_level(GPIO_NUM_7, 0);
              }
            }
          } else {
            if (id(pwr_state) == 1) {
              id(pwr_state) = 2;
            }
            id(pwr_long_press) = 0;
          }

sensor:
  - platform: adc
    pin: GPIO8
    id: battery_voltage
    name: "Tension batterie"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 10s
    attenuation: 12db
    samples: 32
    sampling_mode: avg
    filters:
      - multiply: 3.0
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
          send_first_at: 1
    on_value:
      then:
        - lambda: |-
            // LiPo discharge curve (light load), voltage → SoC %
            // Sorted high → low for linear interpolation.
            static const float LIPO[][2] = {
              {4.20f, 100.0f}, {4.15f, 95.0f}, {4.11f, 90.0f}, {4.08f, 85.0f},
              {4.02f,  80.0f}, {3.98f, 75.0f}, {3.95f, 70.0f}, {3.91f, 65.0f},
              {3.87f,  60.0f}, {3.85f, 55.0f}, {3.84f, 50.0f}, {3.82f, 45.0f},
              {3.80f,  40.0f}, {3.79f, 35.0f}, {3.77f, 30.0f}, {3.75f, 25.0f},
              {3.73f,  20.0f}, {3.71f, 15.0f}, {3.69f, 10.0f}, {3.61f,  5.0f},
              {3.27f,   0.0f},
            };
            const size_t N = sizeof(LIPO) / sizeof(LIPO[0]);
            float v = x;
            float pct_f;
            if (v >= LIPO[0][0]) {
              pct_f = 100.0f;
            } else if (v <= LIPO[N - 1][0]) {
              pct_f = 0.0f;
            } else {
              pct_f = 0.0f;
              for (size_t i = 0; i < N - 1; i++) {
                if (v <= LIPO[i][0] && v >= LIPO[i + 1][0]) {
                  float v_hi = LIPO[i][0], v_lo = LIPO[i + 1][0];
                  float p_hi = LIPO[i][1], p_lo = LIPO[i + 1][1];
                  pct_f = p_lo + (v - v_lo) * (p_hi - p_lo) / (v_hi - v_lo);
                  break;
                }
              }
            }
            int pct = (int) (pct_f + 0.5f);
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            id(battery_percentage).publish_state(pct);
            int w = (pct * 20) / 100;
            if (w < 2) w = 2;
            lv_obj_set_width(id(battery_fill), w);
            uint32_t color;
            if (pct > 50) color = 0x00AE42;
            else if (pct > 20) color = 0xFFA500;
            else color = 0xFF4444;
            lv_obj_set_style_bg_color(id(battery_fill), lv_color_hex(color), 0);
  - platform: template
    id: battery_percentage
    name: "Batterie"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0

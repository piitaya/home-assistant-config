http_request:
  useragent: "ESPHome/BambuReader"
  timeout: 10s

text:
  - platform: template
    id: spoolman_url
    name: "Spoolman URL"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (id(spoolman_enabled).state) {
            lv_label_set_text(id(lbl_sync_icon), "\U000F04E6");
            lv_obj_set_style_text_color(id(lbl_sync_icon), lv_color_hex(0x00AE42), 0);
          }

switch:
  - platform: template
    id: spoolman_enabled
    name: "Spoolman sync"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - lvgl.label.update:
            id: lbl_sync_icon
            text: "\U000F04E6"
            text_color: 0x00AE42
    on_turn_off:
      then:
        - lvgl.label.update:
            id: lbl_sync_icon
            text: "\U000F04E8"
            text_color: 0x555555

globals:
  # Workflow state shared between sequential HTTP steps within a single sync run.
  - id: sm_vendor_id
    type: int
    initial_value: "0"
  - id: sm_filament_id
    type: int
    initial_value: "0"
  - id: sm_spool_found
    type: bool
    initial_value: "false"
  - id: sm_error
    type: bool
    initial_value: "false"

script:
  - id: spoolman_sync
    # restart: a fresh scan during an in-flight sync replaces it instead of being dropped.
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (!id(spoolman_enabled).state) return false;
              auto url = id(spoolman_url).state;
              return url.rfind("http://", 0) == 0 || url.rfind("https://", 0) == 0;
          then:
            - lambda: |-
                ESP_LOGI("spoolman", "Début sync Spoolman: tag=%s | %s | %s",
                  id(tray_uid_sens).state.c_str(),
                  id(filament_type_sens).state.c_str(),
                  id(filament_color_name_sens).state.c_str());
                id(sm_spool_found) = false;
                id(sm_filament_id) = 0;
                id(sm_vendor_id) = 0;
                id(sm_error) = false;

            # 1. Chercher le tag dans les spools du même material
            - http_request.get:
                url: !lambda |-
                  return id(spoolman_url).state +
                    "/api/v1/spool?filament.material=" +
                    spoolman_helpers::url_encode(id(filament_type_sens).state) +
                    "&allow_archived=true";
                capture_response: true
                max_response_buffer_size: 524288
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("spoolman", "GET spools failed: %d", response->status_code);
                          id(sm_error) = true;
                          return;
                        }
                        std::string tray = id(tray_uid_sens).state;
                        size_t tray_pos = body.find(tray);
                        if (tray_pos == std::string::npos) {
                          return;  // Pas trouvée — on continuera la création
                        }
                        id(sm_spool_found) = true;
                        std::string search = body.substr(0, tray_pos);
                        bool archived = spoolman_helpers::json_field_bool(search, "archived", false);
                        if (archived) {
                          spoolman_helpers::set_remaining_label(id(lbl_remaining), id(lbl_detail_remaining), "Archivée", id(color_lum));
                          ESP_LOGI("spoolman", "Bobine %s trouvée — archivée", tray.c_str());
                          return;
                        }
                        float rw = spoolman_helpers::json_field_float(search, "remaining_weight", -1.0f);
                        if (rw >= 0.0f) {
                          char buf[16];
                          snprintf(buf, sizeof(buf), "%.0f g", rw);
                          spoolman_helpers::set_remaining_label(id(lbl_remaining), id(lbl_detail_remaining), buf, id(color_lum));
                          ESP_LOGI("spoolman", "Bobine %s trouvée — restant: %.0fg", tray.c_str(), rw);
                        } else {
                          spoolman_helpers::set_remaining_label(id(lbl_remaining), id(lbl_detail_remaining), "Inconnu", id(color_lum));
                          ESP_LOGI("spoolman", "Bobine %s trouvée", tray.c_str());
                        }

            # 2. Si erreur ou bobine trouvée → terminé
            - if:
                condition:
                  lambda: 'return id(sm_error) || id(sm_spool_found);'
                then:
                  - logger.log:
                      level: INFO
                      tag: spoolman
                      format: "Sync terminée — bobine existante"
                else:
                  # 3. Chercher le filament par external_id (spoolmandb) puis fallback material+color_hex
                  - http_request.get:
                      url: !lambda |-
                        using namespace spoolman_catalog;
                        auto *e = find(id(variant_id_sens).state.c_str());
                        if (e) {
                          return id(spoolman_url).state +
                            "/api/v1/filament?external_id=" + std::string(e->spoolman_id);
                        }
                        std::string color_hex = id(filament_color_sens).state;
                        if (!color_hex.empty() && color_hex[0] == '#')
                          color_hex = color_hex.substr(1);
                        return id(spoolman_url).state +
                          "/api/v1/filament?material=" +
                          spoolman_helpers::url_encode(id(filament_type_sens).state) +
                          "&color_hex=" + color_hex;
                      capture_response: true
                      max_response_buffer_size: 4096
                      on_response:
                        then:
                          - lambda: |-
                              if (response->status_code != 200) {
                                ESP_LOGW("spoolman", "GET filaments failed: %d", response->status_code);
                                id(sm_error) = true;
                                return;
                              }
                              if (body.length() <= 2 || body == "[]") return;
                              int fid = (int) spoolman_helpers::json_field_float(body, "id", 0.0f);
                              if (fid > 0) {
                                id(sm_filament_id) = fid;
                                ESP_LOGI("spoolman", "Filament trouvé: id=%d", fid);
                              }

                  # 4. Créer le filament si inexistant
                  - if:
                      condition:
                        lambda: 'return id(sm_filament_id) == 0 && !id(sm_error);'
                      then:
                        # Chercher/créer le vendor "Bambu Lab"
                        - http_request.get:
                            url: !lambda 'return id(spoolman_url).state + "/api/v1/vendor?name=Bambu%20Lab";'
                            capture_response: true
                            max_response_buffer_size: 2048
                            on_response:
                              then:
                                - lambda: |-
                                    if (response->status_code == 200 && body.length() > 2 && body != "[]") {
                                      int vid = (int) spoolman_helpers::json_field_float(body, "id", 0.0f);
                                      if (vid > 0) {
                                        id(sm_vendor_id) = vid;
                                        ESP_LOGI("spoolman", "Vendor Bambu Lab trouvé: id=%d", vid);
                                      }
                                    }
                        - if:
                            condition:
                              lambda: 'return id(sm_vendor_id) == 0;'
                            then:
                              - http_request.post:
                                  url: !lambda 'return id(spoolman_url).state + "/api/v1/vendor";'
                                  request_headers:
                                    Content-Type: application/json
                                  json: |-
                                    root["name"] = "Bambu Lab";
                                  capture_response: true
                                  max_response_buffer_size: 1024
                                  on_response:
                                    then:
                                      - lambda: |-
                                          if (response->status_code == 200 || response->status_code == 201) {
                                            int vid = (int) spoolman_helpers::json_field_float(body, "id", 0.0f);
                                            if (vid > 0) {
                                              id(sm_vendor_id) = vid;
                                              ESP_LOGI("spoolman", "Vendor Bambu Lab créé: id=%d", vid);
                                            }
                                          } else {
                                            ESP_LOGW("spoolman", "POST vendor failed: %d", response->status_code);
                                          }
                        # Créer le filament
                        - http_request.post:
                            url: !lambda 'return id(spoolman_url).state + "/api/v1/filament";'
                            request_headers:
                              Content-Type: application/json
                            json: |-
                              using namespace spoolman_catalog;
                              auto *e = find(id(variant_id_sens).state.c_str());
                              std::string color_hex = id(filament_color_sens).state;
                              if (!color_hex.empty() && color_hex[0] == '#')
                                color_hex = color_hex.substr(1);
                              // Nom : SpoolmanDB si dispo, sinon color_name Bambu
                              root["name"] = e ? std::string(e->name) : id(filament_color_name_sens).state;
                              root["material"] = id(filament_type_sens).state;
                              if (id(sm_vendor_id) > 0) root["vendor_id"] = id(sm_vendor_id);
                              root["color_hex"] = color_hex;
                              if (e) root["external_id"] = e->spoolman_id;
                              // Densité : SpoolmanDB si dispo, sinon fallback par matériau
                              root["density"] = (e && e->density > 0)
                                ? e->density
                                : spoolman_helpers::default_density(id(filament_type_sens).state.c_str());
                              root["diameter"] = id(filament_diameter_sens).state;
                              root["weight"] = id(spool_weight_sens).state;
                              // Poids du carton vide : SpoolmanDB si dispo, sinon 250g par défaut
                              root["spool_weight"] = (e && e->spool_weight > 0) ? e->spool_weight : 250;
                              root["settings_extruder_temp"] = (int)((id(min_hotend_temp_sens).state + id(max_hotend_temp_sens).state) / 2);
                              root["settings_bed_temp"] = (int)id(bed_temp_sens).state;
                            capture_response: true
                            max_response_buffer_size: 2048
                            on_response:
                              then:
                                - lambda: |-
                                    if (response->status_code == 200 || response->status_code == 201) {
                                      int fid = (int) spoolman_helpers::json_field_float(body, "id", 0.0f);
                                      if (fid > 0) {
                                        id(sm_filament_id) = fid;
                                        ESP_LOGI("spoolman", "Filament créé: id=%d", fid);
                                      }
                                    } else {
                                      ESP_LOGW("spoolman", "POST filament failed: %d", response->status_code);
                                    }

                  # 5. Créer le spool
                  - if:
                      condition:
                        lambda: 'return id(sm_filament_id) > 0 && !id(sm_error);'
                      then:
                        - http_request.post:
                            url: !lambda 'return id(spoolman_url).state + "/api/v1/spool";'
                            request_headers:
                              Content-Type: application/json
                            json: |-
                              root["filament_id"] = id(sm_filament_id);
                              root["remaining_weight"] = id(spool_weight_sens).state;
                              JsonObject extra = root["extra"].to<JsonObject>();
                              // Spoolman attend des valeurs JSON-encodées dans extra
                              extra["tag"] = "\"" + id(tray_uid_sens).state + "\"";
                            capture_response: true
                            max_response_buffer_size: 1024
                            on_response:
                              then:
                                - lambda: |-
                                    if (response->status_code == 200 || response->status_code == 201) {
                                      spoolman_helpers::set_remaining_label(id(lbl_remaining), id(lbl_detail_remaining), "Nouvelle", id(color_lum));
                                      ESP_LOGI("spoolman", "Bobine créée: %s (%s)",
                                        id(filament_color_name_sens).state.c_str(),
                                        id(filament_type_sens).state.c_str());
                                    } else {
                                      ESP_LOGW("spoolman", "POST spool failed: %d — %s", response->status_code, body.c_str());
                                    }
                      else:
                        - logger.log:
                            level: WARN
                            tag: spoolman
                            format: "Impossible de créer la bobine — filament_id manquant"

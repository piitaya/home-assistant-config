external_components:
  - source:
      type: local
      path: components
    components: [bambu_nfc]

spi:
  - id: nfc_spi
    clk_pin: GPIO18
    mosi_pin: GPIO15
    miso_pin: GPIO44

bambu_nfc:
  spi_id: nfc_spi
  cs_pin: GPIO43
  update_interval: 1s
  filament_type:
    id: filament_type_sens
    name: "Type de filament"
  filament_type_simple:
    name: "Type de filament (court)"
  filament_color:
    id: filament_color_sens
    name: "Couleur du filament"
  secondary_color:
    name: "Couleur secondaire"
  color_alpha:
    name: "Alpha couleur"
  color_count:
    name: "Nombre de couleurs"
  material_id:
    name: "Material ID"
  variant_id:
    id: variant_id_sens
    name: "Variant ID"
  tag_uid:
    name: "Tag UID"
  tray_uid:
    id: tray_uid_sens
    name: "Tray UID"
  production_date:
    name: "Date de production"
  last_scan_date:
    id: last_scan_date_sens
    name: "Dernier scan"
  min_hotend_temp:
    id: min_hotend_temp_sens
    name: "Temp min buse"
  max_hotend_temp:
    id: max_hotend_temp_sens
    name: "Temp max buse"
  bed_temp:
    id: bed_temp_sens
    name: "Temp plateau"
  bed_temp_type:
    name: "Type plateau"
  spool_weight:
    id: spool_weight_sens
    name: "Poids bobine"
  filament_diameter:
    id: filament_diameter_sens
    name: "Diamètre filament"
  drying_temp:
    id: drying_temp_sens
    name: "Temp séchage"
  drying_time:
    id: drying_time_sens
    name: "Durée séchage"
  nozzle_diameter:
    name: "Diamètre buse"
  spool_width:
    name: "Largeur bobine"
  filament_length:
    id: filament_length_sens
    name: "Longueur filament"
  reset:
    name: "Reset filament"

esphome:
  includes:
    - lecteur-de-filament/filaments.h
    - lecteur-de-filament/spoolman_catalog.h
    - lecteur-de-filament/spoolman_helpers.h

text_sensor:
  - platform: template
    id: filament_color_name_sens
    name: "Nom couleur"
    icon: mdi:format-color-fill

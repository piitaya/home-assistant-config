http_request:
  useragent: "ESPHome/BambuReader"
  timeout: 10s

text:
  - platform: template
    id: bss_url
    name: "Bambu Spoolman Sync URL"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(tray_uid_sens).state.empty() && id(tray_uid_sens).state != "unknown";'
            then:
              - script.execute: bss_sync

wifi:
  on_connect:
    then:
      - lvgl.label.update:
          id: lbl_wifi_icon
          text: "\U000F05A9"
          text_color: 0x888888
      - if:
          condition:
            lambda: 'return !id(tray_uid_sens).state.empty() && id(tray_uid_sens).state != "unknown";'
          then:
            - script.execute: bss_sync
  on_disconnect:
    then:
      - lvgl.label.update:
          id: lbl_wifi_icon
          text: "\U000F05AA"
          text_color: 0x888888

script:
  - id: bss_sync
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (!wifi::global_wifi_component->is_connected()) return false;
              auto url = id(bss_url).state;
              return url.rfind("http://", 0) == 0 || url.rfind("https://", 0) == 0;
          then:
            - lambda: |-
                ESP_LOGI("bss", "Scan: tag=%s | %s | %s",
                  id(tray_uid_sens).state.c_str(),
                  id(filament_type_sens).state.c_str(),
                  id(filament_color_name_sens).state.c_str());

            # 1. GET spool by tag — check if already known
            - lambda: |-
                ESP_LOGI("bss", "GET %s/api/spools/%s",
                  id(bss_url).state.c_str(),
                  id(tray_uid_sens).state.c_str());
            - http_request.get:
                url: !lambda 'return id(bss_url).state + "/api/spools/" + id(tray_uid_sens).state;'
                capture_response: true
                max_response_buffer_size: 4096
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          lv_obj_add_flag(id(btn_details_full), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_clear_flag(id(btn_details_small), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_add_flag(id(btn_add), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_clear_flag(id(btn_registered), LV_OBJ_FLAG_HIDDEN);

                          uint32_t fg = id(color_lum) > 0.5f ? 0x000000 : 0xFFFFFF;
                          std::string key = "\"remain\":";
                          size_t pos = body.find(key);
                          if (pos != std::string::npos) {
                            pos += key.size();
                            while (pos < body.size() && body[pos] == ' ') pos++;
                            if (pos < body.size() && body[pos] != 'n') {
                              float remain = std::strtof(body.c_str() + pos, nullptr);
                              float grams = id(spool_weight_sens).state * remain / 100.0f;
                              char buf[16];
                              snprintf(buf, sizeof(buf), "%.0f g", grams);
                              lv_label_set_text(id(lbl_remaining), buf);
                              lv_obj_set_style_text_color(id(lbl_remaining), lv_color_hex(fg), 0);
                              lv_label_set_text(id(lbl_detail_remaining), buf);
                              ESP_LOGI("bss", "Bobine trouvée — restant: %.0f%% (%.0fg)", remain, grams);
                            }
                          }
                          ESP_LOGI("bss", "Bobine trouvée");
                        } else if (response->status_code == 404) {
                          lv_obj_add_flag(id(btn_details_full), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_clear_flag(id(btn_details_small), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_clear_flag(id(btn_add), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_add_flag(id(btn_registered), LV_OBJ_FLAG_HIDDEN);
                          ESP_LOGI("bss", "Bobine inconnue");
                        } else {
                          ESP_LOGW("bss", "GET spool failed: %d", response->status_code);
                        }

  - id: bss_put
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("bss", "POST %s/api/spools/scan",
            id(bss_url).state.c_str());
      - http_request.post:
          url: !lambda 'return id(bss_url).state + "/api/spools/scan";'
          request_headers:
            Content-Type: application/json
          json: |-
            root["uid"] = id(tray_uid_sens).state;
            root["variant_id"] = id(variant_id_sens).state;
            root["material"] = id(filament_type_sens).state;
            root["product"] = id(filament_type_detailed_sens).state;
            std::string color = id(filament_color_sens).state;
            if (!color.empty() && color[0] == '#') color = color.substr(1);
            root["color_hex"] = color;
            root["weight"] = id(spool_weight_sens).state;
            root["temp_min"] = id(min_hotend_temp_sens).state;
            root["temp_max"] = id(max_hotend_temp_sens).state;
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200 || response->status_code == 201) {
                    lv_obj_add_flag(id(btn_add), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_clear_flag(id(btn_registered), LV_OBJ_FLAG_HIDDEN);
                    // btn_details_small already visible
                    ESP_LOGI("bss", "Bobine enregistrée: %s (%s)",
                      id(filament_color_name_sens).state.c_str(),
                      id(filament_type_sens).state.c_str());
                  } else {
                    ESP_LOGW("bss", "POST scan failed: %d — %s", response->status_code, body.c_str());
                  }

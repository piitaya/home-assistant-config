esphome:
  name: lumiere-lave-vaisselle
  friendly_name: Lumière Lave-vaisselle

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret lumiere_lave_vaisselle_api_encryption_key

ota:
  - platform: esphome
    password: !secret lumiere_lave_vaisselle_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:
    
light:
  - platform: neopixelbus
    type: GRB 
    variant: WS2812X
    pin: D2  
    method: BIT_BANG
    num_leds: 1
    name: ""
    default_transition_length: 0.5s
    restore_mode: ALWAYS_OFF
# Board: Heltec WiFi LoRa 32 V3 / V3.2 (ESP32-S3 + SX1262, TCXO 1.8 V, pas de FEM)
#
# Moniteur IO passif @ 868 MHz — écoute et logge les trames io-homecontrol
# (TaHoma, télécommandes, io-proxy). Aucune entité, n'émet rien.
# Doc : https://github.com/laberning/home_io_control

substitutions:
  name: io-monitor
  friendly_name: IO Monitor

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  build_flags:
    - -DIOHOME_FRAME_LOG

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret io_monitor_api_encryption_key

ota:
  - platform: esphome
    password: !secret io_monitor_ota_password

packages:
  wifi: !include common/wifi.yaml

external_components:
  - source: github://laberning/home_io_control

# --------------------------------------------------------------------------
# SX1262 (pinout Heltec V3)
# --------------------------------------------------------------------------
spi:
  clk_pin: 9
  mosi_pin: 10
  miso_pin: 11

home_io_control:
  cs_pin: 8
  rst_pin: 12
  dio1_pin: 14
  busy_pin: 13
  radio_type: sx1262
  tcxo_voltage: 1_8V

  # Identité propre au moniteur, distincte de l'io-proxy (ne pilote rien).
  node_id: !secret io_monitor_node_id
  system_key: !secret io_monitor_system_key

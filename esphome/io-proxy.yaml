# Board: Heltec WiFi LoRa 32 V3 / V3.2 (ESP32-S3 + SX1262, TCXO 1.8 V, pas de FEM)
#
# IO proxy via home_io_control @ 868 MHz — pilote les devices io-homecontrol
# (stores, pergola, LED) en local, sans passer par la TaHoma.
# Doc : https://github.com/laberning/home_io_control

substitutions:
  name: io-proxy
  friendly_name: IO Proxy

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret io_proxy_api_encryption_key

ota:
  - platform: esphome
    password: !secret io_proxy_ota_password

packages:
  wifi: !include common/wifi.yaml

external_components:
  - source: github://laberning/home_io_control

# --------------------------------------------------------------------------
# SX1262 (pinout Heltec V3)
# --------------------------------------------------------------------------
spi:
  clk_pin: 9
  mosi_pin: 10
  miso_pin: 11

home_io_control:
  cs_pin: 8
  rst_pin: 12
  dio1_pin: 14
  busy_pin: 13
  radio_type: sx1262
  tcxo_voltage: 1_8V

  node_id: !secret io_node_id
  system_key: !secret io_system_key

  # Onboarding — à retirer une fois les devices déclarés plus bas.
  accept_foreign_pairing: true      # switch "Recover System Key" (clé depuis la TaHoma)
  scan_paired_devices_button: true  # bouton "Scan Paired Devices"
  discover_and_pair_button: true    # bouton "Discover & Pair" (device neuf / reset)


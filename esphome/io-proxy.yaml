# Board: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
#
# IO proxy via home_io_control @ 868 MHz — controls io-homecontrol awnings and LEDs.

substitutions:
  name: io-proxy
  friendly_name: IO Proxy

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  devices:
    - id: store_allee_device
      name: Store Allée
    - id: store_cimetiere_device
      name: Store Cimetière
    - id: grand_store_jardin_device
      name: Grand store Jardin
    - id: petit_store_jardin_device
      name: Petit store Jardin
    - id: led_spa_device
      name: LED Spa
    - id: led_table_device
      name: LED Table

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    # Constant heat pump ↔ TaHoma radio traffic.
    home_io_control.soft_phy: ERROR
    io_frame: WARN
    io_capture: WARN

api:
  encryption:
    key: !secret io_proxy_api_encryption_key

ota:
  - platform: esphome
    password: !secret io_proxy_ota_password

packages:
  wifi: !include common/wifi.yaml

external_components:
  - source: github://laberning/home_io_control

spi:
  clk_pin: 9
  mosi_pin: 10
  miso_pin: 11

home_io_control:
  cs_pin: 8
  rst_pin: 12
  dio1_pin: 14
  busy_pin: 13
  radio_type: sx1262
  tcxo_voltage: 1_8V

  node_id: !secret io_node_id
  system_key: !secret io_system_key

cover:
  - platform: home_io_control
    id: store_allee
    name: ""
    device_id: store_allee_device
    device_class: shade
    io_device_id: "AF6B36"
    io_device_type: awning
    io_subtype: 0
  - platform: home_io_control
    id: store_cimetiere
    name: ""
    device_id: store_cimetiere_device
    device_class: shade
    io_device_id: "E01101"
    io_device_type: awning
    io_subtype: 0
  - platform: home_io_control
    id: grand_store_jardin
    name: ""
    device_id: grand_store_jardin_device
    device_class: shade
    io_device_id: "4AFEB2"
    io_device_type: awning
    io_subtype: 0
  - platform: home_io_control
    id: petit_store_jardin
    name: ""
    device_id: petit_store_jardin_device
    device_class: shade
    io_device_id: "8ED107"
    io_device_type: awning
    io_subtype: 0

light:
  - platform: home_io_control
    id: led_spa
    name: ""
    device_id: led_spa_device
    io_device_id: "18DFD9"
    io_device_type: light
    io_subtype: 0
    dimmable: true
  - platform: home_io_control
    id: led_table
    name: ""
    device_id: led_table_device
    io_device_id: "1D63A1"
    io_device_type: light
    io_subtype: 0
    dimmable: true

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  disp_bg_color: 0x1A1A1A
  disp_bg_opa: COVER
  style_definitions:
    - id: style_page
      bg_color: 0x1A1A1A
      bg_opa: COVER
      scrollbar_mode: "OFF"
    - id: style_circle
      width: 120
      height: 120
      radius: 60
      bg_opa: COVER
      border_width: 3
      scrollbar_mode: "OFF"
    - id: style_text_primary
      text_color: 0xFFFFFF
      text_font: font_large
      text_align: CENTER
    - id: style_text_secondary
      text_color: 0x999999
      text_font: font_medium
      text_align: CENTER
    - id: style_text_uid
      text_color: 0x999999
      text_font: font_tiny
      text_align: CENTER
  pages:
    # ── Page Idle ──
    - id: page_idle
      styles: style_page
      widgets:
        - obj:
            align: CENTER
            y: -55
            styles: style_circle
            bg_color: 0x2D2D2D
            border_color: 0x00AE42
            widgets:
              - obj:
                  align: CENTER
                  width: 40
                  height: 40
                  radius: 20
                  bg_color: 0x1A1A1A
                  bg_opa: COVER
                  border_width: 2
                  border_color: 0x00AE42
                  scrollbar_mode: "OFF"
        - label:
            align: CENTER
            y: 40
            width: 220
            text: "Lecteur de filament"
            styles: style_text_primary
        - label:
            align: CENTER
            y: 72
            width: 220
            text: "En attente d'un tag..."
            styles: style_text_secondary
        - label:
            id: error_label
            align: BOTTOM_MID
            y: -20
            text: ""
            text_color: 0xFF4444
            text_font: font_medium

    # ── Page Filament ──
    - id: page_filament
      styles: style_page
      on_press:
        then:
          - lvgl.page.show: page_idle
      widgets:
        - obj:
            id: color_circle
            align: CENTER
            y: -55
            styles: style_circle
            bg_color: 0x808080
            border_color: 0x444444
            clickable: false
        - label:
            id: lbl_type
            align: CENTER
            y: 40
            width: 220
            text: "--"
            styles: style_text_primary
        - label:
            id: lbl_color_name
            align: CENTER
            y: 72
            width: 220
            text: "--"
            styles: style_text_secondary
        - label:
            id: lbl_uid
            align: BOTTOM_MID
            y: -10
            width: 230
            text: ""
            styles: style_text_uid

bambu_nfc:
  on_bambu_success:
    then:
      - lvgl.widget.update:
          id: color_circle
          bg_color: !lambda |-
            auto hex = id(filament_color_sens).state;
            if (hex.length() >= 7) {
              uint32_t color = strtol(hex.c_str() + 1, NULL, 16);
              return lv_color_hex(color);
            }
            return lv_color_hex(0x808080);
      - lvgl.label.update:
          id: lbl_type
          text: !lambda 'return id(filament_type_sens).state.c_str();'
      - lvgl.label.update:
          id: lbl_color_name
          text: !lambda 'return id(filament_color_name_sens).state.c_str();'
      - lvgl.label.update:
          id: lbl_uid
          text: !lambda 'return id(tray_uid_sens).state.c_str();'
      - lvgl.page.show: page_filament
  on_bambu_error:
    then:
      - lvgl.page.show: page_idle
      - lvgl.label.update:
          id: error_label
          text: "Erreur de lecture"
      - delay: 3s
      - lvgl.label.update:
          id: error_label
          text: ""
